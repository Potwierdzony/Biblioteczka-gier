  body {
    margin: 0;

  .display { font-family: 'Fraunces', serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
  .eyebrow { display:flex; align-items:center; gap:8px; margin-bottom:4px; color: var(--gold); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
  h1 { color: var(--card); font-weight: 600; font-size: 40px; margin: 0; }
  .author-tag { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; vertical-align: middle; }
  .title-row { display:flex; align-items:center; gap: 12px; }
  .site-logo {
    width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    border: 2px solid var(--gold); box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .sub { color: var(--muted); font-size: 12px; margin-top: 8px; }

  .btn { border: none; cursor: pointer; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 10px 16px; display:inline-flex; align-items:center; gap:6px; }
  .btn-gold { background: var(--gold); color: var(--bg); font-weight: 500; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--gold); }
  .btn-dark { background: var(--ink); color: var(--card); font-weight: 500; }
  .btn-green { background: var(--green); color: var(--card); font-weight: 500; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .header-actions { display:flex; flex-wrap: wrap; gap:8px; align-items:center; justify-content: flex-end; }

  .search-wrap { position: relative; margin-bottom: 24px; }
  .search-wrap input {
    width: 100%; padding: 12px 12px 12px 36px; border-radius: 6px;
    background: #123648; border: 1px solid var(--border); color: var(--card); font-size: 14px; outline:none;
  }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }

  .empty { text-align: center; padding: 60px 0; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 14px; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 3px 12px rgba(0,0,0,0.16); }
  .card-top { padding: 16px 16px 12px; display:flex; justify-content:space-between; gap:12px; border-bottom: 1px dashed var(--border-card); }
  .card-top-main { display:flex; gap:12px; min-width:0; }
  .card-thumb { width: 56px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-card); flex-shrink: 0; background: var(--card-alt); }
  .card-thumb-placeholder { width: 56px; height: 72px; border-radius: 6px; border: 1px dashed var(--border-card); flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size: 20px; color: var(--label); background: var(--card-alt); }
  .card-top h3 { margin:0; color: var(--ink); font-size: 20px; font-weight: 600; }
  .card-top p { margin: 4px 0 0; color: var(--ink-muted); font-size: 12px; }
  .card-top a.bgg-link { display:inline-flex; align-items:center; gap:4px; margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); text-decoration: none; }
  .card-top a.bgg-link:hover { text-decoration: underline; }
  .meta-row { display:flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .category-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.03em;
    padding: 2px 8px; border-radius: 20px; background: var(--ink); color: var(--card);
  }
  .tag-chip {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    padding: 2px 8px; border-radius: 20px; background: transparent; color: var(--ink-muted); border: 1px solid var(--border-card);
  }
  .edit-btn { background:none; border:none; cursor:pointer; color: var(--label); padding: 4px; flex-shrink: 0; }

  .card-body { padding: 12px 16px; }
  .status-row { display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 8px; }
  .status-row .status-actions { display:flex; gap: 6px; flex-wrap: wrap; }
  .btn-sm { padding: 8px 10px; font-size: 11px; }
  .status-available { color: var(--green); font-size: 12px; font-family: 'JetBrains Mono', monospace; display:flex; align-items:center; gap:6px; }
  .status-borrowed { color: var(--gold); font-size: 12px; font-family: 'JetBrains Mono', monospace; display:flex; align-items:center; gap:6px; }
  .status-overdue { color: var(--red); }
  .borrow-info { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4A4536; margin-top: 8px; line-height: 1.6; }
  .borrow-info b { color: var(--ink); font-weight: 500; }

  .card-footer { padding: 10px 16px; background: var(--card-alt); display:flex; justify-content:space-between; align-items:center; }
  .card-footer span { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--label); }
  .qr-btn { background: none; border: none; cursor: pointer; display:flex; align-items:center; gap:6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(15,20,17,0.7); display:flex; align-items:center; justify-content:center; padding: 16px; z-index: 100; }
  .modal { background: var(--card); border-radius: 10px; width: 100%; max-width: 380px; max-height: 88vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal.modal-wide { max-width: min(480px, 94vw); }
  .modal-body { overflow-y: auto; overflow-x: hidden; flex: 1 1 auto; min-height: 0; min-width: 0; }
  .modal-head { flex-shrink: 0; }
  .modal-foot { flex-shrink: 0; }
  .modal-head { padding: 16px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px dashed var(--border-card); }
  .modal-head h2 { margin:0; font-size: 18px; color: var(--ink); font-weight: 600; }
  .modal-head button { background:none; border:none; cursor:pointer; color: var(--label); }
  .modal-body { padding: 16px 20px; display:flex; flex-direction:column; gap:12px; }
  .field label { font-family:'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing:0.05em; color: var(--label); }
  .field input {
    width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border-card); font-size: 14px; outline: none; font-family: 'Inter', sans-serif; color: var(--ink);
  }
  .field input[type="file"] { padding: 6px 8px; font-size: 12px; }
  .field textarea {
    width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border-card); font-size: 13px; outline: none; font-family: 'JetBrains Mono', monospace; color: var(--ink);
    resize: vertical; min-height: 140px;
  }
  .file-preview-row { display:flex; align-items:center; gap:10px; margin-top: 6px; }
  .file-preview-row img { width: 44px; height: 58px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border-card); }
  .file-preview-row button { background:none; border:none; cursor:pointer; color: var(--red); font-family:'JetBrains Mono', monospace; font-size: 11px; }
  .field-hint { font-size: 11px; color: var(--label); margin-top: 3px; }
  .modal-foot { padding: 16px 20px; border-top: 1px dashed var(--border-card); display:flex; justify-content:space-between; align-items:center; }
  .delete-link { background:none; border:none; cursor:pointer; color: var(--red); font-family:'JetBrains Mono', monospace; font-size:12px; display:flex; align-items:center; gap:5px; }

  .qr-body { padding: 24px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; overflow-y:auto; min-height:0; }
  .qr-body img { border-radius: 6px; }
  .qr-url { font-family:'JetBrains Mono', monospace; font-size: 10px; color: var(--label); text-align:center; word-break: break-all; padding: 0 8px; }
  .qr-hint { font-size: 12px; color: var(--ink-muted); text-align:center; padding: 0 16px; }

  .save-error { margin-bottom: 20px; padding: 8px 16px; border-radius: 6px; background: #3A2320; color: #E8A99B; font-family:'JetBrains Mono', monospace; font-size: 12px; }
  .config-error { max-width: 900px; margin: 60px auto; padding: 24px; background: #F0EAD9; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #16232b; line-height: 1.7; }
  .config-error code { background: #E6DFC8; padding: 2px 6px; border-radius: 4px; }
  .sync-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#4F7A57; margin-right:6px; }
  .sync-dot.offline { background: #A8483A; }
  .viewer-badge {
    display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size: 12px;
    color: var(--muted); background: #123648; border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px;
  }
  .viewer-badge .viewer-dot { width:7px; height:7px; border-radius:50%; background:#4F7A57; box-shadow: 0 0 0 0 rgba(79,122,87,0.6); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79,122,87,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(79,122,87,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,122,87,0); }
  }

  /* ---- Motyw jasny ---- */
  body.light {
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMjAnIGhlaWdodD0nMzIwJyB2aWV3Qm94PScwIDAgMzIwIDMyMCc+CjxnIGZpbGw9J25vbmUnIHN0cm9rZT0ncmdiYSgyMiwzNSw0MywwLjAzKScgc3Ryb2tlLXdpZHRoPScxLjMnPgo8cmVjdCB4PSczOCcgeT0nNDYnIHdpZHRoPSczOCcgaGVpZ2h0PSczOCcgcng9JzcnIHRyYW5zZm9ybT0ncm90YXRlKC02IDU3IDY1KScvPgo8Y2lyY2xlIGN4PSc0OScgY3k9JzU4JyByPScyLjMnIGZpbGw9J3JnYmEoMjIsMzUsNDMsMC4wMyknIHN0cm9rZT0nbm9uZScgdHJhbnNmb3JtPSdyb3RhdGUoLTYgNTcgNjUpJy8+CjxjaXJjbGUgY3g9JzY1JyBjeT0nNTgnIHI9JzIuMycgZmlsbD0ncmdiYSgyMiwzNSw0MywwLjAzKScgc3Ryb2tlPSdub25lJyB0cmFuc2Zvcm09J3JvdGF0ZSgtNiA1NyA2NSknLz4KPGNpcmNsZSBjeD0nNDknIGN5PSc3Mycgcj0nMi4zJyBmaWxsPSdyZ2JhKDIyLDM1LDQzLDAuMDMpJyBzdHJva2U9J25vbmUnIHRyYW5zZm9ybT0ncm90YXRlKC02IDU3IDY1KScvPgo8Y2lyY2xlIGN4PSc2NScgY3k9JzczJyByPScyLjMnIGZpbGw9J3JnYmEoMjIsMzUsNDMsMC4wMyknIHN0cm9rZT0nbm9uZScgdHJhbnNmb3JtPSdyb3RhdGUoLTYgNTcgNjUpJy8+CjxwYXRoIGQ9J00yMjggMTUwYzggMCAxMiA4IDguOCAxMy42bDkuNCAxN2MyLjIgNC0wLjkgOC40LTQuOSA4LjRoLTUuN3YxOWgtMTQuNHYtMTloLTUuN2MtNCAwLTcuMS00LjQtNC45LTguNGw5LjQtMTdjLTMuMi01LjYgMC45LTEzLjYgOC45LTEzLjZ6JyB0cmFuc2Zvcm09J3JvdGF0ZSg4IDIzMiAxNzgpJy8+Cjxwb2x5Z29uIHBvaW50cz0nMTUwLDIzMCAxNjYsMjIxIDE4MiwyMzAgMTgyLDI1MCAxNjYsMjU5IDE1MCwyNTAnIHRyYW5zZm9ybT0ncm90YXRlKC00IDE2NiAyNDApJy8+CjwvZz4KPC9zdmc+"), linear-gradient(225deg, #F2ECDD 0%, #EDE6D6 100%);
    background-size: 320px 320px, auto;
    background-repeat: repeat, no-repeat;
    background-attachment: fixed, fixed;
    --bg: #EDE6D6;
    --card: #FFFFFF;
    --card-alt: #F3EEE0;
    --border: #D9D0BA;
    --border-card: #E0D8C0;
    --gold: #9C7538;
    --green: #3F6B49;
    --red: #A8483A;

    --ink: #16232b;
    --ink-muted: #6B6555;
    --label: #8A8270;

  }
  :root { --heading: #F0EAD9; }
  h1 { color: var(--heading); }
  body.light .search-wrap input { background: #fff; color: var(--ink); border-color: var(--border-card); }
  body.light .search-icon { color: var(--label); }
  body.light .viewer-badge { background: #fff; }
  body.light .shelf-tile .shelf-name { color: var(--heading); }
  body.light .sub { color: var(--ink-muted); }

  /* ---- Pasek kontrolek (sortowanie / filtry / widok) ---- */
  .controls-row { display:flex; flex-wrap: wrap; gap: 8px; align-items:center; margin-bottom: 14px; }
  select.ctrl-select {
    font-family:'JetBrains Mono', monospace; font-size: 12px; padding: 8px 10px; border-radius: 6px;
    background: #123648; border: 1px solid var(--border); color: var(--card); outline:none; cursor:pointer;
  }
  body.light select.ctrl-select { background: #fff; color: var(--ink); border-color: var(--border-card); }
  .view-toggle { display:flex; border: 1px solid var(--border); border-radius: 6px; overflow:hidden; }
  .view-toggle button {
    border:none; background: transparent; color: var(--muted); font-family:'JetBrains Mono', monospace; font-size: 12px;
    padding: 8px 12px; cursor:pointer;
  }
  .view-toggle button.active { background: var(--gold); color: var(--bg); }
  .group-toggle-label {
    display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); cursor:pointer;
  }

  .filter-panel {
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 16px; padding: 12px; border-radius: 8px;
    background: #123648; border: 1px solid var(--border);
  }
  body.light .filter-panel { background: #fff; border-color: var(--border-card); }
  .filter-panel button.clear-filters {
    background:none; border: 1px solid var(--border); color: var(--muted); font-family:'JetBrains Mono', monospace;
    font-size: 11px; padding: 8px 10px; border-radius: 6px; cursor:pointer;
  }

  /* ---- Grupowanie po kategorii ---- */
  .group-header {
    font-family:'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--gold); margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--border);
  }
  .group-header:first-child { margin-top: 0; }

  /* ---- Widok półki ---- */
  .shelf-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px; }
  .shelf-tile { cursor:pointer; text-align:center; }
  .shelf-tile .shelf-img, .shelf-tile .shelf-placeholder {
    width:100%; aspect-ratio: 3/4; object-fit:cover; border-radius: 8px; border: 1px solid var(--border);
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
  }
  .shelf-tile .shelf-placeholder { display:flex; align-items:center; justify-content:center; font-size: 26px; background: var(--card-alt); color: var(--label); }
  .shelf-tile .shelf-name { margin-top: 7px; font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--heading); }
  .shelf-status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }

  /* ---- Historia wypożyczeń ---- */
  .history-row { display:flex; justify-content:space-between; gap: 10px; font-family:'JetBrains Mono', monospace; font-size: 12px; padding: 7px 0; border-bottom: 1px dashed var(--border-card); color: var(--ink); }
  .history-row:last-child { border-bottom: none; }
  .history-row span { color: var(--ink-muted); white-space:nowrap; }
  .loan-count { color: var(--label); }

  /* ---- Animacje modali ---- */
  .modal-overlay { opacity: 0; transition: opacity 0.18s ease; }
  .modal-overlay.show { opacity: 1; }
  .modal { transform: scale(0.94) translateY(8px); transition: transform 0.18s ease; }
  .modal-overlay.show .modal { transform: scale(1) translateY(0); }

  /* ---- Hover na kartach ---- */
  .card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
  .shelf-tile { transition: transform 0.15s ease; }
  .shelf-tile:hover { transform: translateY(-3px); }
  .shelf-tile img, .shelf-tile .shelf-placeholder { transition: box-shadow 0.15s ease; }
  .shelf-tile:hover .shelf-img, .shelf-tile:hover .shelf-placeholder { box-shadow: 0 6px 16px rgba(0,0,0,0.3); }

  /* ---- Płynne przejście przy zmianie widoku/filtrów ---- */
  #results { transition: opacity 0.15s ease; }
  #results.fading { opacity: 0; }

  /* ---- Skeleton loading ---- */
  .skeleton-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; height: 150px; overflow:hidden; position:relative; }
  .skeleton-line { background: var(--card-alt); border-radius: 4px; margin-bottom: 10px; position:relative; overflow:hidden; }
  .skeleton-line::after {
    content:""; position:absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  /* ---- Pusty stan ---- */
  .empty { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .empty .empty-icon { font-size: 34px; opacity: 0.6; }

  /* ---- Konfetti przy zwrocie ---- */
  .confetti-piece {
    position: fixed; top: -10px; width: 8px; height: 8px; border-radius: 2px; pointer-events:none; z-index: 999;
    animation: confetti-fall 1.1s ease-in forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(90vh) rotate(400deg); opacity: 0; }
  }

  /* ---- Panel statystyk ---- */
  .stats-row { display:grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px; margin-bottom: 20px; min-width: 0; }
  .stat-box { background: #123648; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  body.light .stat-box { background: #fff; border-color: var(--border-card); }
  .stat-box .stat-label { font-family:'JetBrains Mono', monospace; font-size: 10px; text-transform:uppercase; letter-spacing:0.05em; color: var(--muted); }
  .stat-box .stat-value { font-family:'Fraunces', serif; font-size: 18px; font-weight: 600; color: var(--heading); margin-top: 4px; line-height:1.3; }
  body.light .stat-box .stat-value { color: var(--ink); }

  /* ---- Oś czasu wypożyczeń ---- */
  .timeline-wrap { margin-bottom: 20px; }
  .timeline-title { font-family:'JetBrains Mono', monospace; font-size: 11px; text-transform:uppercase; letter-spacing:0.05em; color: var(--muted); margin-bottom: 8px; }
  .timeline-strip { display:flex; gap: 10px; overflow-x:auto; padding-bottom: 4px; }
  .timeline-chip {
    flex-shrink:0; display:flex; align-items:center; gap:8px; background: var(--card); border: 1px solid var(--border-card);
    border-radius: 20px; padding: 6px 12px 6px 6px; cursor:pointer;
  }
  .timeline-chip .tc-info { font-size: 11px; font-family:'JetBrains Mono', monospace; color: var(--ink); line-height:1.3; }
  .timeline-chip .tc-info b { color: var(--ink); }
  .timeline-chip .tc-info span { color: var(--ink-muted); display:block; }

  /* ---- Awatar inicjałów ---- */
  .avatar {
    display:inline-flex; align-items:center; justify-content:center; width: 22px; height: 22px; border-radius:50%;
    font-family:'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; color: #fff; flex-shrink:0;
  }
  .avatar-lg { width: 28px; height: 28px; font-size: 11px; }

  /* ---- Walidacja i licznik znaków ---- */
  .field-error { color: var(--red); font-size: 11px; margin-top: 3px; display:none; }
  .field.invalid input { border-color: var(--red); }
  .field.invalid .field-error { display:block; }
  .char-counter { font-family:'JetBrains Mono', monospace; font-size: 10px; color: var(--label); text-align:right; margin-top: 3px; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
  }
  .shake { animation: shake 0.3s ease; }

  /* ---- Potwierdzenie usunięcia ---- */
  .confirm-body { padding: 20px; text-align:center; overflow-y:auto; min-height:0; }
  .confirm-body p { font-size: 14px; color: var(--ink); margin: 0 0 16px; }
  .confirm-actions { display:flex; gap:10px; justify-content:center; }

  /* ---- Mikro-interakcje przycisków ---- */
  .btn { transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease; }
  .btn:not(:disabled):active { transform: scale(0.95); }
  .btn:not(:disabled):hover { filter: brightness(1.06); }
  .edit-btn, .qr-btn, .delete-link { transition: transform 0.12s ease, color 0.12s ease; }
  .edit-btn:active, .qr-btn:active, .delete-link:active { transform: scale(0.92); }

  /* ---- Wjazd panelu filtrów (płynne rozwijanie zamiast display:none) ---- */
  .filter-panel {
    display:flex; overflow:hidden; max-height: 0; padding-top:0; padding-bottom:0; margin-bottom:0;
    border-width: 0; opacity: 0;
    transition: max-height 0.22s ease, opacity 0.18s ease, padding 0.22s ease, margin 0.22s ease, border-color 0.18s ease;
  }
  .filter-panel.open { max-height: 220px; padding: 12px; margin-bottom: 16px; border-width: 1px; opacity: 1; }

  /* ---- Wejście strony przy pierwszym załadowaniu (jedna, zorkiestrowana sekwencja) ---- */
  .pre-intro header, .pre-intro .stats-row, .pre-intro .search-wrap, .pre-intro .controls-row { opacity: 0; transform: translateY(10px); }
  .intro-play header { animation: intro-rise 0.5s cubic-bezier(.2,.7,.3,1) forwards; }
  .intro-play .stats-row { animation: intro-rise 0.5s cubic-bezier(.2,.7,.3,1) forwards 0.09s; }
  .intro-play .search-wrap { animation: intro-rise 0.5s cubic-bezier(.2,.7,.3,1) forwards 0.16s; }
  .intro-play .controls-row { animation: intro-rise 0.5s cubic-bezier(.2,.7,.3,1) forwards 0.22s; }
  @keyframes intro-rise { to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .pre-intro header, .pre-intro .stats-row, .pre-intro .search-wrap, .pre-intro .controls-row { opacity:1 !important; transform:none !important; }
    .intro-play header, .intro-play .stats-row, .intro-play .search-wrap, .intro-play .controls-row { animation:none !important; }
  }

  /* ---- Delikatne wejście kart przy zmianie widoku/filtrów ---- */
  .card, .shelf-tile { animation: card-in 0.28s ease backwards; }
  @keyframes card-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- Toasty (zamiast alert()) ---- */
  .toast-stack { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index: 400; align-items:center; }
  .toast {
    background: var(--ink); color: var(--card); font-family:'JetBrains Mono', monospace; font-size: 12px;
    padding: 10px 18px; border-radius: 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    display:flex; align-items:center; gap:8px; opacity:0; transform: translateY(10px) scale(0.96);
    animation: toast-in 0.25s ease forwards;
  }
  .toast.leaving { animation: toast-out 0.2s ease forwards; }
  @keyframes toast-in { to { opacity:1; transform: translateY(0) scale(1); } }
  @keyframes toast-out { to { opacity:0; transform: translateY(6px) scale(0.96); } }

  /* ---- Odznaka powiadomień ---- */
  .notif-btn.active { color: var(--green); border-color: var(--green); }

  /* ---- Pasek ikon-narzędzi (szybkie akcje w oknie gry) ---- */
  .icon-toolbar { display:flex; align-items:center; gap:8px; padding-top: 12px; margin-top: 12px; border-top: 1px dashed var(--border-card); }
  .icon-toolbar-btn {
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:none; border:1px solid var(--border-card); color: var(--ink);
    width:40px; height:40px; border-radius:10px; cursor:pointer; font-size:16px; flex-shrink:0;
    transition: background .15s ease, transform .12s ease, border-color .15s ease;
  }
  .icon-toolbar-btn:hover { background: var(--card-alt); border-color: var(--gold); }
  .icon-toolbar-btn:active { transform: scale(0.92); }
  .icon-toolbar-spacer { flex:1; }

  /* ---- Odznaka rezerwacji na karcie ---- */
  .reservation-badge {
    display:inline-flex; align-items:center; gap:5px; font-family:'JetBrains Mono', monospace; font-size: 11px;
    color: var(--gold); background: rgba(184,147,95,0.12); border: 1px dashed var(--border-card);
    padding: 4px 9px; border-radius: 20px; margin-top: 7px; cursor:pointer;
  }

  /* ---- Mini-kalendarz rezerwacji ---- */
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .cal-head button { background:none; border:1px solid var(--border-card); color: var(--ink); border-radius:8px; width:34px; height:34px; font-size:16px; cursor:pointer; }
  .cal-head span { font-family:'Fraunces', serif; font-weight:600; font-size:16px; color: var(--ink); text-transform: capitalize; }
  .cal-grid { display:grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto; grid-auto-rows: 44px; gap: 6px; min-width: 0; width: 100%; }
  .cal-dow { text-align:center; font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--label); padding-bottom: 4px; }
  .cal-day {
    display:flex; align-items:center; justify-content:center; border-radius: 8px;
    font-family:'JetBrains Mono', monospace; font-size: 13px; color: var(--ink); position:relative;
    border: 1px solid transparent;
  }
  .cal-day.empty { visibility:hidden; }
  .cal-day.past { color: var(--label); opacity: 0.45; }
  .cal-day.today { border-color: var(--gold); font-weight:700; }
  .cal-day.reserved { background: rgba(168,72,58,0.16); color: var(--red); font-weight:600; }
  .cal-day.selected { background: var(--green); color: #fff; }
  .cal-day.clickable { cursor: pointer; transition: background 0.12s, transform 0.12s; }
  .cal-day.clickable:hover { background: rgba(79,122,87,0.14); transform: scale(1.06); }
  .cal-day.reserved.clickable { cursor: not-allowed; }
  .cal-day.reserved.clickable:hover { background: rgba(168,72,58,0.16); transform: none; }
  /* pasek wybranego terminu (Od → Do) */
  .cal-day.sel-mid, .cal-day.sel-start, .cal-day.sel-end { color: #fff; font-weight: 600; z-index: 1; }
  .cal-day.sel-mid::before, .cal-day.sel-start::before, .cal-day.sel-end::before {
    content: ''; position: absolute; top: 4px; bottom: 4px; left: -3px; right: -3px;
    background: var(--green); z-index: -1;
  }
  .cal-day.sel-start::before { left: 2px; border-radius: 8px 0 0 8px; }
  .cal-day.sel-end::before { right: 2px; border-radius: 0 8px 8px 0; }
  .cal-day.sel-start.sel-end::before { border-radius: 8px; }
  .cal-day.sel-start, .cal-day.sel-end { background: var(--green); border-radius: 8px; }
  .cal-day.sel-start.clickable:hover, .cal-day.sel-end.clickable:hover { background: var(--green); }
  .cal-day.sel-mid.clickable:hover { background: transparent; }
  .cal-day.sel-preview::before {
    content: ''; position: absolute; top: 4px; bottom: 4px; left: -3px; right: -3px;
    background: rgba(79,122,87,0.22); z-index: -1;
  }
  .cal-day.sel-preview.preview-end::before { right: 2px; border-radius: 0 8px 8px 0; }
  .cal-hint { font-size: 11px; color: var(--label); margin-top: 6px; font-family:'JetBrains Mono', monospace; }
  .cal-legend { display:flex; gap:14px; margin-top:8px; font-size:11px; color: var(--ink-muted); font-family:'JetBrains Mono', monospace; }
  .cal-legend span { display:flex; align-items:center; gap:5px; }
  .cal-dot { width:9px; height:9px; border-radius:3px; display:inline-block; }
  .reservation-row { display:flex; justify-content:space-between; align-items:center; gap:10px; font-family:'JetBrains Mono', monospace; font-size: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border-card); }
  .reservation-row:last-child { border-bottom:none; }
  .reservation-row button { background:none; border:none; color: var(--red); cursor:pointer; font-family:'JetBrains Mono', monospace; font-size: 11px; }

  /* ---- Ranking / statystyki graczy ---- */
  .rank-section-title { font-family:'JetBrains Mono', monospace; font-size: 11px; text-transform:uppercase; letter-spacing:0.06em; color: var(--muted); margin: 18px 0 10px; }
  .rank-section-title:first-child { margin-top: 0; }
  .rank-row { display:flex; align-items:center; gap:10px; margin-bottom: 10px; }
  .rank-position { font-family:'Fraunces', serif; font-weight:700; font-size: 14px; color: var(--label); width: 18px; flex-shrink:0; }
  .rank-label { display:flex; align-items:center; gap:7px; font-size:13px; color: var(--ink); min-width: 108px; flex-shrink:0; }
  .rank-bar-track { flex:1; background: var(--card-alt); border-radius: 20px; height: 16px; overflow:hidden; }
  .rank-bar-fill { height:100%; border-radius:20px; width:0%; transition: width 0.6s cubic-bezier(.2,.7,.3,1); }
  .rank-count { font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-muted); width: 38px; text-align:right; flex-shrink:0; }
  .rank-empty { font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--label); }

  /* ---- Dekoracyjne ilustracje po bokach (smok, zamek, pionki i kości, skrzynia z grami, stos pudełek, rycerz z magiem) ---- */
  .deco-layer {
    position: fixed; z-index: -1; pointer-events: none;
    opacity: 0.62;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
  }
  body.light .deco-layer { opacity: 0.5; filter: drop-shadow(0 6px 14px rgba(22,35,43,0.2)); }
  .deco-layer svg { display:block; width:100%; height:100%; overflow:visible; }
  .deco-layer svg * { stroke-linecap: round; stroke-linejoin: round; }

  /* kolory dopasowane do dominującej palety strony (granat/teal + złoto + krem) */
  .dc-gold   { fill: var(--gold); }
  .dc-green  { fill: #2e7f9b; }        /* teal – główny kolor obiektów */
  .dc-red    { fill: #3a6579; }        /* głębszy granatowo-teal (dachy, tunika, skrzynia) */
  .dc-cream  { fill: var(--card); }
  .dc-cream2 { fill: var(--card-alt); }
  .dc-ink    { fill: var(--ink); }
  .dc-muted  { fill: var(--muted); }
  .dc-navy   { fill: #1d4b5e; }
  .dc-line   { fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .dc-line-gold { fill: none; stroke: var(--gold); stroke-width: 1.4; }
  .dc-outline { stroke: rgba(8,24,36,0.6); stroke-width: 1.4; }

  .deco-dragon   { top: 5%;  right: 1.5vw; width: 270px; height: 210px; animation: deco-fly 9s ease-in-out infinite; }
  .deco-castle   { bottom: 3%; left: 1.5vw; width: 220px; height: 240px; }
  .deco-meeples  { top: 17%; left: 2vw; width: 130px; height: 160px; }
  .deco-wanderer { bottom: 6%; right: 2vw; width: 190px; height: 170px; animation: deco-bob 7s ease-in-out infinite 0.4s; }
  .deco-chest    { top: 47%; left: 2vw; width: 190px; height: 160px; transform: translateY(-50%); }
  .deco-boxes    { top: 47%; right: 2.5vw; width: 180px; height: 170px; transform: translateY(-50%); }

  /* skrzynia z grami */
  .dc-chest-glow { animation: dc-glow 2.6s ease-in-out infinite; transform-origin: 100px 74px; }
  .dc-coin-a { animation: dc-coin 2.8s ease-in-out infinite; }
  .dc-coin-b { animation: dc-coin 2.8s ease-in-out infinite 0.9s; }
  .dc-coin-c { animation: dc-coin 2.8s ease-in-out infinite 1.8s; }
  .dc-chest-lid { transform-origin: 30px 78px; animation: dc-lid 6s ease-in-out infinite; }

  /* stos pudełek z klepsydrą */
  .dc-sand-top    { transform-origin: 90px 62px; animation: dc-sand-top 6s linear infinite; }
  .dc-sand-bottom { transform-origin: 90px 106px; animation: dc-sand-bottom 6s linear infinite; }
  .dc-sand-stream { animation: deco-flicker 0.5s ease-in-out infinite; }
  .dc-card-fan    { transform-origin: 40px 150px; animation: dc-fan 5s ease-in-out infinite; }

  /* smok */
  .dg-wing-front { transform-origin: 138px 104px; animation: dg-flap 1.7s ease-in-out infinite; }
  .dg-wing-back  { transform-origin: 126px 108px; animation: dg-flap 1.7s ease-in-out infinite -0.85s; opacity: 0.8; }
  .dg-tail       { transform-origin: 84px 128px;  animation: dg-tail 3.2s ease-in-out infinite; }
  .dg-flame-a    { transform-origin: 226px 56px;  animation: dg-fire 0.9s ease-in-out infinite; }
  .dg-flame-b    { transform-origin: 226px 56px;  animation: dg-fire 0.9s ease-in-out infinite 0.45s; }
  .dg-smoke      { animation: dg-smoke 3s ease-out infinite; }
  .dg-smoke-b    { animation-delay: 1.5s; }
  .dg-eye        { animation: dg-blink 4.5s ease-in-out infinite; transform-origin: 190px 50px; }

  /* zamek */
  .deco-flag  { transform-origin: 110px 40px; animation: deco-flag 2.6s ease-in-out infinite; }
  .dc-window  { animation: deco-flicker 1.8s ease-in-out infinite; }
  .dc-window:nth-child(2) { animation-delay: 0.4s; }
  .dc-window:nth-child(3) { animation-delay: 0.9s; }
  .dc-window:nth-child(4) { animation-delay: 1.3s; }
  .dc-star    { animation: dc-twinkle 2.4s ease-in-out infinite; }
  .dc-star-b  { animation-delay: 0.8s; }
  .dc-star-c  { animation-delay: 1.6s; }

  /* pionki i kości */
  .mp-a { animation: deco-bob 3.4s ease-in-out infinite; }
  .mp-b { animation: deco-bob 3.4s ease-in-out infinite 0.5s; }
  .mp-c { animation: deco-bob 3.4s ease-in-out infinite 1s; }
  .dc-die-a { transform-origin: 34px 128px; animation: dc-roll 6s ease-in-out infinite; }
  .dc-die-b { transform-origin: 88px 132px; animation: dc-roll 6s ease-in-out infinite -3s; }

  /* rycerz i mag */
  .dc-sword  { transform-origin: 62px 84px; animation: dc-swing 3s ease-in-out infinite; }
  .dc-orb    { animation: dc-glow 2s ease-in-out infinite; transform-origin: 150px 34px; }
  .dc-plume  { transform-origin: 56px 22px; animation: deco-flag 2.6s ease-in-out infinite 0.6s; }

  @keyframes deco-fly {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-16px, -18px) rotate(-3deg); }
  }
  @keyframes deco-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes deco-flag {
    0%, 100% { transform: rotate(-4deg) skewY(0deg); }
    50% { transform: rotate(8deg) skewY(-6deg); }
  }
  @keyframes deco-flicker {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  @keyframes dg-flap {
    0%, 100% { transform: rotate(-14deg) scaleY(1); }
    50% { transform: rotate(12deg) scaleY(0.85); }
  }
  @keyframes dg-tail {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(6deg); }
  }
  @keyframes dg-fire {
    0%, 100% { transform: scale(0.85, 0.9); opacity: 0.6; }
    50% { transform: scale(1.12, 1.08); opacity: 0.95; }
  }
  @keyframes dg-smoke {
    0% { transform: translate(0,0) scale(0.6); opacity: 0; }
    30% { opacity: 0.5; }
    100% { transform: translate(14px,-40px) scale(1.4); opacity: 0; }
  }
  @keyframes dg-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }
  @keyframes dc-twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  @keyframes dc-roll {
    0%, 40%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-18deg) translateY(-6px); }
    60% { transform: rotate(12deg) translateY(0); }
    70% { transform: rotate(-4deg); }
    80% { transform: rotate(0deg); }
  }
  @keyframes dc-swing {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }
  @keyframes dc-coin {
    0%, 100% { transform: translateY(0); opacity: 0.9; }
    50% { transform: translateY(-5px); opacity: 1; }
  }
  @keyframes dc-lid {
    0%, 100% { transform: rotate(-22deg); }
    50% { transform: rotate(-30deg); }
  }
  @keyframes dc-sand-top {
    0% { transform: scaleY(1); }
    100% { transform: scaleY(0.05); }
  }
  @keyframes dc-sand-bottom {
    0% { transform: scaleY(0.05); }
    100% { transform: scaleY(1); }
  }
  @keyframes dc-fan {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-4deg); }
  }
  @keyframes dc-glow {
    0%, 100% { opacity: 0.6; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  @media (max-width: 1280px) {
    .deco-layer { display: none; }
  }
  @media (max-height: 820px) {
    .deco-chest, .deco-boxes { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .deco-layer, .deco-layer * { animation: none !important; }
  }

  /* ---- Poprawki dla telefonów / wąskich ekranów ---- */
  @media (max-width: 600px) {
    .wrap { padding: 24px 14px; }
    h1 { font-size: 26px; }
    .site-logo { width: 36px; height: 36px; }
    .author-tag { display: block; margin-left: 0; margin-top: 3px; }
    header { gap: 12px; }
    .header-actions { justify-content: flex-start; width: 100%; }
    .header-actions .btn { padding: 8px 12px; font-size: 11px; }
    .viewer-badge { font-size: 11px; padding: 5px 10px; }
    .controls-row { width: 100%; }
    .controls-row > * { flex: 1 1 auto; }
    select.ctrl-select { min-width: 0; }

    .stats-row { grid-template-columns: 1fr; }
    .modal { max-width: 94vw; }
    .modal-foot { flex-wrap: wrap; gap: 10px; }
    .card-footer { flex-wrap: wrap; gap: 8px; }
    .shelf-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; }
  }
</style>

<script>

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gamesRef = db.ref('games');
const coversRef = db.ref('covers');
const coverCache = new Map(); // id -> zdjęcie (base64/URL) lub null jeśli brak

function uid() { return Math.random().toString(36).slice(2, 10); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  if (!d) return "—";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("pl-PL", { day: "2-digit", month: "short", year: "numeric" });
}
function daysUntil(d) {
  if (!d) return null;
  const today = new Date(todayStr() + "T00:00:00");
  const target = new Date(d + "T00:00:00");
  return Math.round((target - today) / 86400000);
}

// ---- Pomocnicze funkcje do rezerwacji ----
function rangesOverlap(aFrom, aTo, bFrom, bTo) {
  return aFrom <= bTo && bFrom <= aTo;
}
function upcomingReservations(g) {
  const today = todayStr();
  return (g.reservations || [])
    .filter(r => r.dateTo >= today)
    .sort((a, b) => a.dateFrom.localeCompare(b.dateFrom));
}
function nextReservation(g) {
  return upcomingReservations(g)[0] || null;
}
function findReservationConflict(g, dateFrom, dateTo, excludeId) {
  return (g.reservations || []).find(r => r.id !== excludeId && rangesOverlap(r.dateFrom, r.dateTo, dateFrom, dateTo)) || null;
}

// Zapisuje TYLKO metadane jednej gry (bez zdjęcia) - używane przy statusie/wypożyczeniu/zwrocie/historii.
// Nie rusza zdjęcia okładki, więc te operacje są bardzo lekkie transferowo.
function saveGameMeta(game) {
  db.ref('games/' + game.id).set(game).catch(() => {
    document.getElementById('saveErrorBox').style.display = 'block';
  });
}

// Zapisuje metadane ORAZ (opcjonalnie) zdjęcie okładki - używane przy dodawaniu/edycji gry.
function saveGameWithCover(game, coverImage) {
  const meta = { ...game, hasCover: !!coverImage };
  const updates = {};
  updates['games/' + game.id] = meta;
  updates['covers/' + game.id] = coverImage || null;
  coverCache.set(game.id, coverImage || null);
  db.ref().update(updates).catch(() => {
    document.getElementById('saveErrorBox').style.display = 'block';
  });
}

// Usuwa grę - zarówno metadane, jak i jej zdjęcie (jeśli istniało).
function deleteGameRemote(id) {
  const updates = {};
  updates['games/' + id] = null;
  updates['covers/' + id] = null;
  coverCache.delete(id);
  db.ref().update(updates).catch(() => {
    document.getElementById('saveErrorBox').style.display = 'block';
  });
}

// Pobiera zdjęcie okładki (z pamięci podręcznej albo z Firebase, tylko raz na sesję).
async function getCover(id) {
  if (coverCache.has(id)) return coverCache.get(id);
  try {
    const snap = await coversRef.child(id).once('value');
    const val = snap.val();
    coverCache.set(id, val);
    return val;
  } catch (e) {
    return null;
  }
}

// Po wstawieniu HTML z elementami [data-cover-id] - doczytuje ich zdjęcia asynchronicznie.
function hydrateCovers(root) {
  const scope = root || document;
  scope.querySelectorAll('[data-cover-id]').forEach(async (el) => {
    const id = el.getAttribute('data-cover-id');
    const src = await getCover(id);
    if (src) {
      el.src = src;
    } else {
      const placeholder = document.createElement('div');
      placeholder.className = el.classList.contains('shelf-img') ? 'shelf-placeholder' : 'card-thumb-placeholder';
      placeholder.textContent = '🎲';
      el.replaceWith(placeholder);
    }
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || "";
  return div.innerHTML;
}

function resizeImageFile(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Nie udało się odczytać pliku'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Nieprawidłowy plik graficzny'));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.92));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function extractBggId(url) {
  const m = String(url).match(/boardgamegeek\.com\/(?:boardgame|boardgameexpansion)\/(\d+)/i);
  return m ? m[1] : null;
}

async function fetchBggCover(bggUrl) {
  const id = extractBggId(bggUrl);
  if (!id) throw new Error('To nie wygląda na link do gry na BoardGameGeek (np. boardgamegeek.com/boardgame/12345/nazwa)');
  const apiUrl = `https://boardgamegeek.com/xmlapi2/thing?id=${id}`;

  const proxies = [
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(apiUrl)}`,
    `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`,
  ];

  let lastError = null;
  for (const proxyUrl of proxies) {
    try {
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error('Serwer proxy odpowiedział błędem: ' + res.status);
      let text = await res.text();
      // allorigins /get zwraca JSON z polem "contents" zawierającym oryginalny XML jako string
      if (proxyUrl.includes('allorigins.win/get')) {
        const parsed = JSON.parse(text);
        text = parsed.contents;
      }
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      const imageEl = xml.querySelector('image');
      if (!imageEl || !imageEl.textContent.trim()) throw new Error('Nie znaleziono zdjęcia dla tej gry');
      return imageEl.textContent.trim();
    } catch (err) {
      lastError = err;
    }
  }
  throw new Error('Nie udało się połączyć z BGG (' + (lastError?.message || 'nieznany błąd') + ')');
}

let sortBy = "default";
let viewMode = "shelf";
let groupByCat = false;
let filters = { status: "", category: "", duration: "", players: "" };

function parseDurationHours(d) {
  const m = String(d || "").match(/(\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : 999;
}
function parsePlayersMax(p) {
  const nums = String(p || "").match(/\d+/g);
  return nums ? Math.max(...nums.map(Number)) : 999;
}
function sortGames(list) {
  const arr = [...list];
  if (sortBy === "name") arr.sort((a, b) => a.name.localeCompare(b.name, "pl"));
  else if (sortBy === "popularity") arr.sort((a, b) => (b.history || []).length - (a.history || []).length);
  else if (sortBy === "duration") arr.sort((a, b) => parseDurationHours(a.duration) - parseDurationHours(b.duration));
  else if (sortBy === "players") arr.sort((a, b) => parsePlayersMax(a.players) - parsePlayersMax(b.players));
  return arr;
}

function populateFilterOptions() {
  const build = (id, values, prefix) => {
    const sel = document.getElementById(id);
    const current = sel.value;
    const opts = [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b, "pl"));
    sel.innerHTML = `<option value="">${prefix}: wszystkie</option>` + opts.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    if (opts.includes(current)) sel.value = current;
  };
  build("filterCategory", games.map(g => g.category), "Kategoria");
  build("filterDuration", games.map(g => g.duration), "Czas");
  build("filterPlayers", games.map(g => g.players), "Gracze");
}

function matchesFilters(g) {
  if (filters.status && g.status !== filters.status) return false;
  if (filters.category && (g.category || "") !== filters.category) return false;
  if (filters.duration && (g.duration || "") !== filters.duration) return false;
  if (filters.players && (g.players || "") !== filters.players) return false;
  return true;
}

function updateStats() {
  const box = document.getElementById('statsRow');
  if (games.length === 0) { box.style.display = 'none'; return; }

  // Najpopularniejsza gra (najwięcej wypożyczeń w historii)
  let popular = null;
  games.forEach(g => {
    const c = (g.history || []).length;
    if (c > 0 && (!popular || c > popular.count)) popular = { name: g.name, count: c };
  });

  // Najdłużej wypożyczona obecnie
  let longest = null;
  games.forEach(g => {
    if (g.status === 'borrowed' && g.borrowedDate) {
      const days = Math.max(0, -daysUntil(g.borrowedDate));
      if (!longest || days > longest.days) longest = { name: g.name, days };
    }
  });

  // Łączna liczba wypożyczeń w tym miesiącu
  const now = new Date();
  const ym = now.toISOString().slice(0, 7);
  let monthCount = 0;
  games.forEach(g => {
    (g.history || []).forEach(h => { if ((h.borrowedDate || '').startsWith(ym)) monthCount++; });
    if (g.status === 'borrowed' && (g.borrowedDate || '').startsWith(ym)) monthCount++;
  });

  box.style.display = 'grid';
  box.innerHTML = `
    <div class="stat-box"><div class="stat-label">🏆 Najpopularniejsza</div><div class="stat-value">${popular ? escapeHtml(popular.name) : '—'}</div></div>
    <div class="stat-box"><div class="stat-label">⏳ Najdłużej wypożyczona</div><div class="stat-value">${longest ? escapeHtml(longest.name) + ` (${longest.days} dni)` : '—'}</div></div>
    <div class="stat-box"><div class="stat-label">📅 Wypożyczeń w tym miesiącu</div><div class="stat-value">${monthCount}</div></div>
  `;
}

function updateTimeline() {
  const wrap = document.getElementById('timelineWrap');
  const strip = document.getElementById('timelineStrip');
  const borrowed = games.filter(g => g.status === 'borrowed').sort((a, b) => (a.borrowedDate || '').localeCompare(b.borrowedDate || ''));
  if (borrowed.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  strip.innerHTML = borrowed.map(g => `
    <div class="timeline-chip" onclick="openQuickActions('${g.id}')">
      ${avatarHtml(g.borrower, 'lg')}
      <div class="tc-info"><b>${escapeHtml(g.borrower)}</b><span>${escapeHtml(g.name)} · od ${fmtDate(g.borrowedDate)}</span></div>
    </div>
  `).join('');
}

function render() {
  const results = document.getElementById('results');
  const empty = document.getElementById('emptyState');
  const q = query.trim().toLowerCase();

  updateStats();
  updateTimeline();

  let filtered = games.filter(g =>
    (!q || g.name.toLowerCase().includes(q) || (g.borrower || "").toLowerCase().includes(q)
      || (g.category || "").toLowerCase().includes(q) || (g.tags || "").toLowerCase().includes(q)
      || (g.duration || "").toLowerCase().includes(q) || (g.players || "").toLowerCase().includes(q))
    && matchesFilters(g)
  );
  filtered = sortGames(filtered);

  const out = games.filter(g => g.status === 'borrowed').length;
  document.getElementById('subCount').innerHTML =
    `<span class="sync-dot" id="syncDot"></span>${games.length} pozycji w katalogu · ${out} obecnie wypożyczonych`;

  populateFilterOptions();

  results.classList.add('fading');
  setTimeout(() => {
    if (filtered.length === 0) {
      empty.style.display = 'block';
      empty.innerHTML = games.length === 0
        ? `<span class="empty-icon">🎲</span>Katalog jest pusty. Dodaj pierwszą grę.`
        : `<span class="empty-icon">🔍</span>Brak wyników pasujących do wyszukiwania lub filtrów.`;
      results.innerHTML = '';
      results.classList.remove('fading');
      return;
    }
    empty.style.display = 'none';

    const wrapClass = viewMode === 'shelf' ? 'shelf-grid' : 'grid';
    const tileFn = viewMode === 'shelf' ? shelfTileHtml : cardHtml;

    if (groupByCat) {
      const map = new Map();
      filtered.forEach(g => {
        const key = g.category && g.category.trim() ? g.category.trim() : 'Bez kategorii';
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(g);
      });
      results.innerHTML = [...map.entries()].map(([cat, list]) => `
        <div class="group-header">${escapeHtml(cat)} (${list.length})</div>
        <div class="${wrapClass}">${list.map(tileFn).join('')}</div>
      `).join('');
    } else {
      results.innerHTML = `<div class="${wrapClass}">${filtered.map(tileFn).join('')}</div>`;
    }
    hydrateCovers(results);
    results.classList.remove('fading');
  }, 90);
}

function openModal(html) {
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" id="overlay">${html}</div>`;
  const overlay = document.getElementById('overlay');
  requestAnimationFrame(() => overlay.classList.add('show'));
  overlay.addEventListener('click', (e) => {
    if (e.target.id === 'overlay') closeModal();
  });
  overlay.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      e.preventDefault();
      const primary = overlay.querySelector('.btn-dark, .btn-green');
      if (primary) primary.click();
    }
  });
}
function closeModal() {
  const overlay = document.getElementById('overlay');
  if (!overlay) return;
  overlay.classList.remove('show');
  setTimeout(() => { document.getElementById('modalRoot').innerHTML = ''; }, 150);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('overlay')) closeModal();
});

function confirmAction(message, onConfirm) {
  openModal(`
    <div class="modal">
      <div class="confirm-body">
        <p>${escapeHtml(message)}</p>
        <div class="confirm-actions">
          <button class="btn btn-outline" id="confirm-no">Anuluj</button>
          <button class="btn" style="background:var(--red); color:#fff" id="confirm-yes">Tak, usuń</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById('confirm-no').onclick = closeModal;
  document.getElementById('confirm-yes').onclick = () => { closeModal(); onConfirm(); };
}

function toast(message, kind) {
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast';
  const icon = kind === 'error' ? '⚠️' : '✓';
  el.innerHTML = `<span>${icon}</span><span>${escapeHtml(message)}</span>`;
  stack.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 220);
  }, 3200);
}

function spawnConfetti() {
  const colors = ['#B8935F', '#4F7A57', '#A8483A', '#F0EAD9'];
  for (let i = 0; i < 24; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.2) + 's';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 1400);
  }
}

function initials(name) {
  const parts = String(name || '?').trim().split(/\s+/);
  return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase() || '?';
}
function avatarColor(name) {
  const palette = ['#B8935F', '#4F7A57', '#A8483A', '#6B7A8F', '#8F6B8A', '#7A8F4F'];
  let hash = 0;
  for (const ch of String(name || '')) hash = (hash * 31 + ch.charCodeAt(0)) % 997;
  return palette[hash % palette.length];
}
function avatarHtml(name, size) {
  return `<span class="avatar${size === 'lg' ? ' avatar-lg' : ''}" style="background:${avatarColor(name)}">${initials(name)}</span>`;
}

function openReservations(id) {
  const g = games.find(x => x.id === id);
  if (!g.reservations) g.reservations = [];
  let viewDate = new Date();
  viewDate.setDate(1);

  openModal(`
    <div class="modal modal-wide">
      <div class="modal-head"><h2 class="display">Rezerwacje: ${escapeHtml(g.name)}</h2><button onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="cal-head">
          <button type="button" id="cal-prev">‹</button>
          <span id="cal-label"></span>
          <button type="button" id="cal-next">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-legend">
          <span><span class="cal-dot" style="background:rgba(168,72,58,0.3)"></span>Zarezerwowane</span>
          <span><span class="cal-dot" style="background:transparent;border:1px solid var(--gold)"></span>Dziś</span>
          <span><span class="cal-dot" style="background:var(--green)"></span>Wybrany termin</span>
        </div>
        <div class="cal-hint" id="cal-hint">Kliknij dzień w kalendarzu, aby ustawić datę „Od”, a potem drugi dzień jako „Do”.</div>
        <div style="margin-top:16px">
          <div class="field-hint" style="margin-bottom:6px">Nadchodzące rezerwacje</div>
          <div id="res-list"></div>
        </div>
        <div style="border-top:1px dashed var(--border-card); margin-top:8px; padding-top:14px; display:flex; flex-direction:column; gap:12px">
          <div class="field" id="f-res-name-field"><label>Kto rezerwuje</label><input id="f-res-name" placeholder="Imię i nazwisko" autofocus><div class="field-error">Podaj imię i nazwisko</div></div>
          <div style="display:flex; gap:10px">
            <div class="field" style="flex:1" id="f-res-from-field"><label>Od</label><input id="f-res-from" type="date" min="${todayStr()}"><div class="field-error">Wybierz poprawny zakres dat</div></div>
            <div class="field" style="flex:1"><label>Do</label><input id="f-res-to" type="date" min="${todayStr()}"></div>
          </div>
          <div class="field-hint" id="f-res-status"></div>
        </div>
      </div>
      <div class="modal-foot" style="justify-content:flex-end">
        <button class="btn btn-green" id="f-res-save">📅 Zarezerwuj termin</button>
      </div>
    </div>
  `);

  let previewDate = '';

  function getSel() {
    const from = document.getElementById('f-res-from').value;
    let to = document.getElementById('f-res-to').value;
    if (from && to && to < from) to = '';
    return { from, to };
  }

  function renderCalendar() {
    const label = viewDate.toLocaleDateString('pl-PL', { month: 'long', year: 'numeric' });
    document.getElementById('cal-label').textContent = label;
    const year = viewDate.getFullYear(), month = viewDate.getMonth();
    const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Poniedziałek = 0
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = todayStr();
    const { from, to } = getSel();
    // zakres do podglądu (najechanie myszką po wybraniu "Od")
    const pvFrom = from && !to && previewDate && previewDate > from ? from : '';
    const pvTo = pvFrom ? previewDate : '';
    let cells = ['Pn', 'Wt', 'Śr', 'Cz', 'Pt', 'So', 'Nd'].map(d => `<div class="cal-dow">${d}</div>`).join('');
    for (let i = 0; i < firstDow; i++) cells += `<div class="cal-day empty"></div>`;
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const isReserved = g.reservations.some(r => dateStr >= r.dateFrom && dateStr <= r.dateTo);
      const isPast = dateStr < today;
      const isToday = dateStr === today;
      const cls = [];
      if (isReserved) cls.push('reserved');
      if (isPast) cls.push('past');
      if (isToday) cls.push('today');
      if (!isPast) cls.push('clickable');
      if (from) {
        const end = to || from;
        if (dateStr === from) cls.push('sel-start');
        if (dateStr === end) cls.push('sel-end');
        if (dateStr > from && dateStr < end) cls.push('sel-mid');
      }
      if (pvFrom && dateStr > pvFrom && dateStr <= pvTo) {
        cls.push('sel-preview');
        if (dateStr === pvTo) cls.push('preview-end');
      }
      cells += `<div class="cal-day ${cls.join(' ')}" data-date="${dateStr}" ${isReserved ? 'title="Termin już zarezerwowany"' : ''}>${day}</div>`;
    }
    document.getElementById('cal-grid').innerHTML = cells;
    updateHint();
  }

  function updateHint() {
    const { from, to } = getSel();
    const hint = document.getElementById('cal-hint');
    if (!hint) return;
    if (!from) hint.textContent = 'Kliknij dzień w kalendarzu, aby ustawić datę „Od”, a potem drugi dzień jako „Do”.';
    else if (!to) hint.textContent = `Od ${fmtDate(from)} — teraz kliknij dzień zakończenia („Do”). Kliknięcie wcześniejszej daty zmieni „Od”.`;
    else {
      const days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1;
      hint.textContent = `Wybrano: ${fmtDate(from)} → ${fmtDate(to)} (${days} ${days === 1 ? 'dzień' : 'dni'}). Kliknij inny dzień, aby zacząć od nowa.`;
    }
  }

  function onDayClick(dateStr) {
    const fromEl = document.getElementById('f-res-from');
    const toEl = document.getElementById('f-res-to');
    const { from, to } = getSel();
    if (!from || (from && to) || dateStr < from) {
      // start nowego zakresu
      fromEl.value = dateStr;
      toEl.value = '';
    } else {
      // dateStr >= from, brak "Do"
      toEl.value = dateStr;
    }
    previewDate = '';
    document.getElementById('f-res-status').textContent = '';
    document.getElementById('f-res-from-field').classList.remove('invalid');
    renderCalendar();
  }

  const gridEl = document.getElementById('cal-grid');
  gridEl.addEventListener('click', (e) => {
    const cell = e.target.closest('.cal-day.clickable');
    if (!cell || cell.classList.contains('reserved')) return;
    onDayClick(cell.dataset.date);
  });
  gridEl.addEventListener('mouseover', (e) => {
    const cell = e.target.closest('.cal-day.clickable');
    if (!cell) return;
    const { from, to } = getSel();
    if (!from || to) return;
    if (previewDate !== cell.dataset.date) { previewDate = cell.dataset.date; renderCalendar(); }
  });
  gridEl.addEventListener('mouseleave', () => {
    if (previewDate) { previewDate = ''; renderCalendar(); }
  });
  // ręczna zmiana w polach Od / Do też odświeża pasek w kalendarzu
  document.getElementById('f-res-from').addEventListener('change', renderCalendar);
  document.getElementById('f-res-to').addEventListener('change', renderCalendar);

  function renderResList() {
    const list = upcomingReservations(g);
    document.getElementById('res-list').innerHTML = list.length
      ? list.map(r => `
          <div class="reservation-row">
            <span style="display:flex; align-items:center; gap:7px">${avatarHtml(r.person)}<b style="color:var(--ink)">${escapeHtml(r.person)}</b> · ${fmtDate(r.dateFrom)} → ${fmtDate(r.dateTo)}</span>
            <button onclick="removeReservation('${g.id}','${r.id}')">Usuń</button>
          </div>`).join('')
      : `<div class="rank-empty">Brak nadchodzących rezerwacji.</div>`;
  }

  renderCalendar();
  renderResList();

  document.getElementById('cal-prev').onclick = () => { viewDate.setMonth(viewDate.getMonth() - 1); renderCalendar(); };
  document.getElementById('cal-next').onclick = () => { viewDate.setMonth(viewDate.getMonth() + 1); renderCalendar(); };

  document.getElementById('f-res-save').onclick = () => {
    const person = document.getElementById('f-res-name').value.trim();
    const from = document.getElementById('f-res-from').value;
    const to = document.getElementById('f-res-to').value || from;
    const nameField = document.getElementById('f-res-name-field');
    const fromField = document.getElementById('f-res-from-field');
    const statusEl = document.getElementById('f-res-status');
    nameField.classList.remove('invalid');
    fromField.classList.remove('invalid');
    statusEl.textContent = '';
    statusEl.style.color = '';

    if (!person) {
      nameField.classList.add('invalid', 'shake');
      document.getElementById('f-res-name').focus();
      setTimeout(() => nameField.classList.remove('shake'), 300);
      return;
    }
    if (!from || to < from) {
      fromField.classList.add('invalid', 'shake');
      setTimeout(() => fromField.classList.remove('shake'), 300);
      return;
    }
    const conflict = findReservationConflict(g, from, to);
    if (conflict) {
      statusEl.style.color = '#A8483A';
      statusEl.textContent = `⚠ Termin koliduje z rezerwacją: ${conflict.person} (${fmtDate(conflict.dateFrom)} → ${fmtDate(conflict.dateTo)})`;
      return;
    }
    g.reservations.push({ id: uid(), person, dateFrom: from, dateTo: to });
    saveGameMeta(g);
    renderCalendar();
    renderResList();
    document.getElementById('f-res-name').value = '';
    document.getElementById('f-res-from').value = '';
    document.getElementById('f-res-to').value = '';
    renderCalendar();
    toast('Zarezerwowano termin dla ' + person);
    render();
  };
}

function removeReservation(gameId, resId) {
  const g = games.find(x => x.id === gameId);
  g.reservations = (g.reservations || []).filter(r => r.id !== resId);
  saveGameMeta(g);
  closeModal();
  openReservations(gameId);
  render();
}

function openQuickActions(id) {
  const g = games.find(x => x.id === id);
  const overdue = g.status === 'borrowed' && g.dueDate && daysUntil(g.dueDate) < 0;
  const loanCount = (g.history || []).length;
  openModal(`
    <div class="modal">
      ${g.hasCover ? `<img data-cover-id="${g.id}" alt="Okładka" style="width:100%; max-height:280px; object-fit:cover; display:block; background:var(--card-alt);">` : ''}
      <div class="modal-head"><h2 class="display">${escapeHtml(g.name)}</h2><button onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        ${g.notes ? `<p style="margin:0; font-size:13px; color:var(--ink-muted)">${escapeHtml(g.notes)}</p>` : ''}
        ${g.bggUrl ? `<a class="bgg-link" href="${escapeHtml(g.bggUrl)}" target="_blank" rel="noopener">🔗 Zasady / opis gry</a>` : ''}
        ${(g.category || g.duration || g.players || g.tags) ? `
          <div class="meta-row">
            ${g.category ? `<span class="category-badge">${escapeHtml(g.category)}</span>` : ''}
            ${g.duration ? `<span class="category-badge" style="background:var(--green)">⏱ ${escapeHtml(g.duration)}</span>` : ''}
            ${g.players ? `<span class="category-badge" style="background:var(--gold); color:var(--ink)">👥 ${escapeHtml(g.players)}</span>` : ''}
            ${(g.tags || '').split(/[\s,]+/).filter(Boolean).map(t => `<span class="tag-chip">${escapeHtml(t.startsWith('#') ? t : '#' + t)}</span>`).join('')}
          </div>` : ''}
        <div style="margin-top:10px">
        ${g.status === 'available'
          ? `<div class="status-available">✓ Dostępna</div>`
          : `<div class="borrow-info" style="display:flex; align-items:center; gap:8px">${avatarHtml(g.borrower)}<span><span class="status-borrowed ${overdue ? 'status-overdue' : ''}">${overdue ? '⚠ Zaległy zwrot' : '⏱ Wypożyczona'}</span><br>Kto: <b>${escapeHtml(g.borrower)}</b><br>Od: ${fmtDate(g.borrowedDate)}${g.dueDate ? ' · do: ' + fmtDate(g.dueDate) : ''}${(g.extensions || []).length ? ' · przedłużono ' + g.extensions.length + 'x' : ''}</span></div>`}
        </div>
        ${loanCount ? `<div class="loan-count" style="margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:11px">Wypożyczano łącznie ${loanCount}x</div>` : ''}
        ${(() => { const nr = nextReservation(g); return nr ? `<div class="reservation-badge" onclick="openReservations('${g.id}')" style="margin-top:8px">📅 ${daysUntil(nr.dateFrom) === 0 ? 'dziś' : fmtDate(nr.dateFrom)} → ${escapeHtml(nr.person)}</div>` : ''; })()}
        <div class="icon-toolbar">
          <button class="icon-toolbar-btn" onclick="openReservations('${id}')" title="Rezerwuj termin">📅</button>
          <button class="icon-toolbar-btn" onclick="openHistory('${id}')" title="Historia wypożyczeń">🕑</button>
          <button class="icon-toolbar-btn" onclick="openQr('${id}')" title="Kod QR">▦</button>
          <span class="icon-toolbar-spacer"></span>
          <button class="icon-toolbar-btn" onclick="openEdit('${id}')" title="Edytuj grę">✎</button>
        </div>
      </div>
      <div class="modal-foot">
        ${g.status === 'available'
          ? `<button class="btn btn-dark" style="width:100%; justify-content:center" onclick="openBorrow('${id}')">Wypożycz</button>`
          : `<div style="display:flex; gap:8px; width:100%">
               <button class="btn btn-outline" style="flex:1; justify-content:center" onclick="openExtend('${id}')">⏳ Przedłuż</button>
               <button class="btn btn-green" style="flex:1; justify-content:center" onclick="returnGame('${id}'); closeModal()">↺ Zwrot</button>
             </div>`}
      </div>
    </div>
  `);
  hydrateCovers(document.getElementById('overlay'));
}

function openQr(id) {
  const g = games.find(x => x.id === id);
  const url = shareUrl(id);
  const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(url)}&color=1F2A24&bgcolor=F0EAD9`;
  openModal(`
    <div class="modal">
      <div class="modal-head"><h2 class="display">${escapeHtml(g.name)}</h2><button onclick="closeModal()">✕</button></div>
      <div class="qr-body">
        <img src="${qrSrc}" width="200" height="200" alt="QR">
        <div class="qr-url">${url}</div>
        <div class="qr-hint">Wydrukuj i nalep na pudełko gry. Zeskanowanie otworzy tę stronę z podświetloną grą.</div>
      </div>
    </div>
  `);
}

function openStats() {
  const borrowerCounts = new Map();
  const gameCounts = new Map();
  let totalLoans = 0;
  let totalDurationDays = 0, durationSamples = 0;

  games.forEach(g => {
    const hist = g.history || [];
    let count = hist.length;
    hist.forEach(h => {
      if (h.borrower) borrowerCounts.set(h.borrower, (borrowerCounts.get(h.borrower) || 0) + 1);
      if (h.borrowedDate && h.returnedDate) {
        const days = Math.max(0, (new Date(h.returnedDate) - new Date(h.borrowedDate)) / 86400000);
        totalDurationDays += days;
        durationSamples++;
      }
    });
    if (g.status === 'borrowed' && g.borrower) {
      count++;
      borrowerCounts.set(g.borrower, (borrowerCounts.get(g.borrower) || 0) + 1);
    }
    if (count > 0) gameCounts.set(g.name, count);
    totalLoans += count;
  });

  const topBorrowers = [...borrowerCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
  const topGames = [...gameCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
  const avgDuration = durationSamples ? Math.round(totalDurationDays / durationSamples) : null;
  const maxBorrower = topBorrowers[0]?.[1] || 1;
  const maxGame = topGames[0]?.[1] || 1;
  const palette = ['#B8935F', '#4F7A57', '#A8483A', '#6B7A8F', '#8F6B8A'];

  const borrowerRows = topBorrowers.length ? topBorrowers.map(([name, count], i) => `
    <div class="rank-row">
      <span class="rank-position">${i + 1}</span>
      <span class="rank-label">${avatarHtml(name)}${escapeHtml(name)}</span>
      <div class="rank-bar-track"><div class="rank-bar-fill" style="background:${palette[i % palette.length]}" data-w="${(count / maxBorrower * 100).toFixed(0)}"></div></div>
      <span class="rank-count">${count}x</span>
    </div>`).join('') : `<div class="rank-empty">Brak jeszcze żadnych wypożyczeń.</div>`;

  const gameRows = topGames.length ? topGames.map(([name, count], i) => `
    <div class="rank-row">
      <span class="rank-position">${i + 1}</span>
      <span class="rank-label">🎲 ${escapeHtml(name)}</span>
      <div class="rank-bar-track"><div class="rank-bar-fill" style="background:${palette[i % palette.length]}" data-w="${(count / maxGame * 100).toFixed(0)}"></div></div>
      <span class="rank-count">${count}x</span>
    </div>`).join('') : `<div class="rank-empty">Brak jeszcze żadnych wypożyczeń.</div>`;

  openModal(`
    <div class="modal modal-wide">
      <div class="modal-head"><h2 class="display">🏆 Ranking i statystyki</h2><button onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="stats-row" style="margin-bottom:6px">
          <div class="stat-box"><div class="stat-label">Łącznie wypożyczeń</div><div class="stat-value">${totalLoans}</div></div>
          <div class="stat-box"><div class="stat-label">Śr. czas wypożyczenia</div><div class="stat-value">${avgDuration !== null ? avgDuration + ' dni' : '—'}</div></div>
        </div>
        <div class="rank-section-title">👤 Najaktywniejsi gracze</div>
        ${borrowerRows}
        <div class="rank-section-title">🎲 Najpopularniejsze gry</div>
        ${gameRows}
      </div>
    </div>
  `);
  // Paski rosną od zera po otwarciu modala - jeden, celowy moment animacji.
  requestAnimationFrame(() => {
    document.querySelectorAll('#overlay .rank-bar-fill').forEach(el => {
      const w = el.getAttribute('data-w');
      requestAnimationFrame(() => { el.style.width = w + '%'; });
    });
  });
}

function openImport() {
  openModal(`
    <div class="modal">
      <div class="modal-head"><h2 class="display">Import listy gier</h2><button onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field">
          <label>Wklej nazwy gier (po jednej w linii)</label>
          <textarea id="f-import" placeholder="SETI
Na dnie morza
Brzdęk: Katakumby
..."></textarea>
        </div>
        <div class="field-hint" id="f-import-status">Gry zostaną dopisane do istniejącej listy — nic nie zostanie skasowane ani nadpisane.</div>
      </div>
      <div class="modal-foot" style="justify-content:flex-end">
        <button class="btn btn-dark" id="f-import-save">Dodaj gry</button>
      </div>
    </div>
  `);
  document.getElementById('f-import-save').onclick = () => {
    const raw = document.getElementById('f-import').value;
    const names = raw.split('\n').map(s => s.trim()).filter(Boolean);
    if (names.length === 0) return;
    const existingNames = new Set(games.map(g => g.name.trim().toLowerCase()));
    const updates = {};
    let added = 0, skipped = 0;
    names.forEach(name => {
      if (existingNames.has(name.toLowerCase())) { skipped++; return; }
      const newGame = {
        id: uid(), name, status: 'available', borrower: '', borrowedDate: '', dueDate: '',
        notes: '', bggUrl: '', hasCover: false, category: '', duration: '', players: '', tags: '', history: [], reservations: []
      };
      games.push(newGame);
      updates['games/' + newGame.id] = newGame;
      existingNames.add(name.toLowerCase());
      added++;
    });
    closeModal();
    if (added > 0) {
      db.ref().update(updates).catch(() => {
        document.getElementById('saveErrorBox').style.display = 'block';
      });
    }
    toast(`Dodano ${added} gier.${skipped ? ' Pominięto ' + skipped + ' (już były na liście).' : ''}`);
  };
}

const THEME_KEY = 'biblioteczka-gier-theme';
function applyTheme(theme) {
  document.body.classList.toggle('light', theme === 'light');
  document.getElementById('themeToggle').textContent = theme === 'light' ? '🌙' : '☀️';
}
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

// ---- Powiadomienia (wersja "lite" - działają tylko gdy ta karta jest otwarta) ----
const NOTIF_KEY = 'biblioteczka-gier-notif-enabled';
const NOTIF_SEEN_KEY = 'biblioteczka-gier-notif-seen';
function notifSupported() { return 'Notification' in window; }
function notifEnabled() { return notifSupported() && Notification.permission === 'granted' && localStorage.getItem(NOTIF_KEY) === '1'; }
function updateNotifBtn() {
  const btn = document.getElementById('notifToggle');
  if (!notifSupported()) { btn.title = 'Ta przeglądarka nie obsługuje powiadomień'; btn.disabled = true; return; }
  btn.classList.toggle('active', notifEnabled());
  btn.title = notifEnabled()
    ? 'Powiadomienia włączone (działają, gdy ta karta jest otwarta)'
    : 'Włącz powiadomienia o zbliżających się terminach zwrotu';
}
function getNotifSeen() {
  try { return JSON.parse(localStorage.getItem(NOTIF_SEEN_KEY) || '{}'); } catch (e) { return {}; }
}
function markNotifSeen(key) {
  const seen = getNotifSeen();
  seen[key] = todayStr();
  localStorage.setItem(NOTIF_SEEN_KEY, JSON.stringify(seen));
}
function checkDueNotifications() {
  if (!notifEnabled()) return;
  const seen = getNotifSeen();
  games.forEach(g => {
    if (g.status === 'borrowed' && g.dueDate) {
      const d = daysUntil(g.dueDate);
      const key = 'due:' + g.id + ':' + g.dueDate;
      if (d !== null && d <= 1 && !seen[key]) {
        const body = d < 0 ? `Termin zwrotu minął ${Math.abs(d)} dni temu (${g.borrower})` : d === 0 ? `Termin zwrotu mija dziś (${g.borrower})` : `Termin zwrotu mija jutro (${g.borrower})`;
        new Notification('🎲 ' + g.name, { body, tag: key });
        markNotifSeen(key);
      }
    }
    (g.reservations || []).forEach(r => {
      const d = daysUntil(r.dateFrom);
      const key = 'res:' + g.id + ':' + r.id;
      if (d !== null && (d === 0 || d === 1) && !seen[key]) {
        new Notification('📅 ' + g.name, { body: d === 0 ? `Rezerwacja ${r.person} zaczyna się dziś` : `Rezerwacja ${r.person} zaczyna się jutro`, tag: key });
        markNotifSeen(key);
      }
    });
  });
}
document.getElementById('notifToggle').onclick = async () => {
  if (!notifSupported()) return;
  if (notifEnabled()) {
    localStorage.setItem(NOTIF_KEY, '0');
    updateNotifBtn();
    toast('Powiadomienia wyłączone.');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    localStorage.setItem(NOTIF_KEY, '1');
    updateNotifBtn();
    toast('Powiadomienia włączone — działają, gdy ta karta jest otwarta.');
    checkDueNotifications();
  } else {
    toast('Brak zgody na powiadomienia w przeglądarce.', 'error');
  }
};
updateNotifBtn();
setInterval(checkDueNotifications, 30 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkDueNotifications(); });

document.getElementById('shareBtn').onclick = () => {
  const base = window.location.href.split('#')[0];
  navigator.clipboard?.writeText(base).then(() => {
    const btn = document.getElementById('shareBtn');
    const old = btn.textContent;
    btn.textContent = 'Skopiowano!';
    setTimeout(() => btn.textContent = old, 2000);
  });
};

// Nasłuchiwanie zmian w czasie rzeczywistym - to jest sedno synchronizacji
// Śledzenie liczby osób aktualnie przeglądających stronę
const presenceListRef = db.ref('presence');
const myPresenceRef = presenceListRef.push();
db.ref('.info/connected').on('value', (snap) => {
  if (snap.val() === true) {
    myPresenceRef.onDisconnect().remove();
    myPresenceRef.set(true);
  }
});
presenceListRef.on('value', (snap) => {
  const count = snap.numChildren();
  const badge = document.getElementById('viewerBadge');
  const countEl = document.getElementById('viewerCount');
  if (count > 0) {
    countEl.textContent = count === 1 ? '1 osoba przegląda' : count + ' osób przegląda';
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }
});

gamesRef.on('value', (snapshot) => {
  const wasFirstLoad = firstLoad;
  const val = snapshot.val();
  if (val === null) {
    // Baza pusta - wgrywamy dane startowe tylko przy pierwszym uruchomieniu
    if (firstLoad) {
      const seedGames = [
        { id: uid(), name: "Nemesis: Odwet", status: "available", borrower: "", borrowedDate: "", dueDate: "", notes: "", bggUrl: "", hasCover: false, category: "", duration: "", players: "", tags: "", history: [], reservations: [] },
        { id: uid(), name: "Gloomhaven", status: "available", borrower: "", borrowedDate: "", dueDate: "", notes: "", bggUrl: "", hasCover: false, category: "", duration: "", players: "", tags: "", history: [], reservations: [] },
      ];
      const seedUpdates = {};
      seedGames.forEach(g => { seedUpdates['games/' + g.id] = g; });
      db.ref().update(seedUpdates);
      games = seedGames;
    }
  } else if (Array.isArray(val)) {
    // Stara struktura danych (tablica ze zdjęciami w środku) - jednorazowa migracja
    // na nową, oszczędniejszą strukturę (metadane osobno od zdjęć).
    const legacyGames = val.filter(Boolean);
    const keyedGames = {};
    const coverUpdates = {};
    legacyGames.forEach(g => {
      const { coverImage, ...meta } = g;
      meta.hasCover = !!coverImage;
      if (!meta.history) meta.history = [];
      if (!meta.reservations) meta.reservations = [];
      keyedGames[g.id] = meta;
      if (coverImage) {
        coverUpdates[g.id] = coverImage;
        coverCache.set(g.id, coverImage);
      }
    });
    gamesRef.set(keyedGames);
    if (Object.keys(coverUpdates).length) coversRef.update(coverUpdates);
    games = Object.values(keyedGames);
  } else {
    games = Object.values(val);
  }
  // Zabezpieczenie dla starszych wpisów zapisanych zanim dodano rezerwacje.
  games.forEach(g => { if (!g.reservations) g.reservations = []; if (!g.history) g.history = []; });
  firstLoad = false;
  document.getElementById('saveErrorBox').style.display = 'none';
  render();
  if (wasFirstLoad) {
    handleQrDeepLink();
    document.body.classList.remove('pre-intro');
    document.body.classList.add('intro-play');
  }
  checkDueNotifications();
}, (error) => {
  document.getElementById('saveErrorBox').style.display = 'block';
  document.getElementById('saveErrorBox').textContent = '⚠️ Błąd połączenia z bazą danych: ' + error.message;
  document.body.classList.remove('pre-intro');
});
// Zabezpieczenie: gdyby z jakiegoś powodu dane nigdy nie doszły, i tak pokaż stronę.
setTimeout(() => document.body.classList.remove('pre-intro'), 4000);

// Obsługa linku z kodu QR (#g-ID) - otwiera pełne okno szczegółów gry,
// działa niezależnie od trybu widoku (Lista / Półka)
function handleQrDeepLink() {
  const hash = window.location.hash.replace('#g-', '');
  if (!hash) return;
  const g = games.find(x => x.id === hash);
  if (!g) return;
  setTimeout(() => {
    openQuickActions(hash);
    const el = document.getElementById('card-' + hash);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.outline = '2px solid #B8935F';
      el.style.outlineOffset = '2px';
    }
  }, 250);
}
