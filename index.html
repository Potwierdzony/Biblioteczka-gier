function tblPad(n) { return String(n).padStart(2, '0'); }
function tblToday() { const d = new Date(); return `${d.getFullYear()}-${tblPad(d.getMonth() + 1)}-${tblPad(d.getDate())}`; }
function tblAddDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${tblPad(d.getMonth() + 1)}-${tblPad(d.getDate())}`; }
function tblGetName() { try { return localStorage.getItem(TBL_NAME_KEY) || arcGetName() || ''; } catch (e) { return ''; } }
function tblSetName(v) { try { localStorage.setItem(TBL_NAME_KEY, v); } catch (e) {} arcSetName(v); }
function tblKey(name) { return String(name || '').toLowerCase().trim().replace(/[.#$\[\]\/\s]+/g, '_').slice(0, 40) || 'anon'; }
function tblIsPast(t) { return t.date < tblToday(); }
function tblGameOf(t) { return t.gameId ? games.find(g => g.id === t.gameId) : null; }
function tblGameName(t) { const g = tblGameOf(t); return g ? g.name : (t.gameName || 'Gra'); }
function tblSeatsOf(t) { return arcClamp(Number(t.seats) || 4, 2, 10); }
function tblPlayers(t) {
  return Object.entries(t.players || {}).map(([key, p]) => ({ key, name: p.name, joinedAt: p.joinedAt || 0 }))
    .sort((a, b) => {
      const ha = tblKey(a.name) === tblKey(t.host) ? 0 : 1, hb = tblKey(b.name) === tblKey(t.host) ? 0 : 1;
      return ha - hb || a.joinedAt - b.joinedAt;
    });
}
function tblIsMine(t) {
  const me = tblGetName();
  if (!me) return false;
  const k = tblKey(me);
  return !!(t.players && t.players[k]) || tblKey(t.host) === k;
}
function tblDayLabel(d) {
  const today = tblToday();
  const long = new Date(d + 'T00:00:00').toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
  if (d === today) return `<b>Dziś</b> · ${long}`;
  if (d === tblAddDays(today, 1)) return `<b>Jutro</b> · ${long}`;
  return long;
}
function tblLongDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function tblSort(a, b) { return (a.date + a.time).localeCompare(b.date + b.time); }
function tblDurationMin(str) {
  const s = String(str || '').toLowerCase().replace(',', '.');
  const h = s.match(/(\d+(?:\.\d+)?)\s*h/), m = s.match(/(\d+)\s*min/);
  const v = (h ? parseFloat(h[1]) * 60 : 0) + (m ? parseInt(m[1], 10) : 0);
  return v || 120;
}
function tblMaxPlayers(p) { const v = parsePlayersMax(p); return v === 999 ? 0 : v; }
function tblWriteError() { toast('Nie udało się zapisać (sprawdź reguły Firebase dla „tables”).', 'error'); }
function tblBoxColor(name) {
  const palette = ['#2e7f9b', '#A8483A', '#4F7A57', '#8F6B8A', '#B8935F', '#3a6579', '#6B7A8F'];
  let h = 0;
  for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return palette[h % palette.length];
}

// ---- synchronizacja z bazą ----
tablesRef.on('value', (snap) => {
  const val = snap.val() || {};
  tblList = Object.values(val).filter(t => t && t.id && t.date).sort(tblSort);
  tblUpdateBadge();
  setTimeout(() => tblHandleLink(false), 0);
  if (document.getElementById('tbl-root') && tblView.mode !== 'form') tblRender();
  setTimeout(() => { try { checkDueNotifications(); } catch (e) {} }, 0);
}, () => {
  const el = document.getElementById('tbl-body');
  if (el) el.innerHTML = '<div class="rank-empty">Brak dostępu do stolików w bazie (sprawdź reguły Firebase dla „tables”).</div>';
});
function tblUpdateBadge() {
  const el = document.getElementById('tablesCount');
  if (el) { const n = tblList.filter(t => !tblIsPast(t)).length; el.textContent = n ? String(n) : ''; }
}

// ---- rysowanie stołu ----
function tblSceneHtml(t, opts) {
  opts = opts || {};
  const size = opts.size || 190;
  const seats = tblSeatsOf(t);
  const players = tblPlayers(t);
  const meKey = tblGetName() ? tblKey(tblGetName()) : null;
  const hostKey = tblKey(t.host);
  const g = tblGameOf(t);
  const gname = tblGameName(t);
  const box = g && g.hasCover
    ? `<img data-cover-id="${g.id}" alt="${escapeHtml(gname)}">`
    : (() => {
        const longest = Math.max(...gname.split(/\s+/).map(w => w.length));
        const fs = longest > 13 ? 0.68 : longest > 11 ? 0.78 : longest > 9 ? 0.9 : 1;
        return `<div class="tbl-box-ph" style="background-color:${tblBoxColor(gname)}; --fs:${fs}"><span>🎲</span><b>${escapeHtml(gname)}</b></div>`;
      })();
  const live = opts.interactive && !tblIsPast(t);
  let seatsHtml = '';
  for (let i = 0; i < seats; i++) {
    const a = 360 * i / seats;
    const p = players[i];
    if (p) {
      const sk = t.id + ':' + p.key;
      const pop = opts.animate && !tblSeen.has(sk);
      if (opts.animate) tblSeen.add(sk);
      const mine = p.key === meKey;
      seatsHtml += `<div class="tbl-seat taken ${mine ? 'me' : ''} ${tblKey(p.name) === hostKey ? 'host' : ''}" style="--a:${a}deg" ${live && mine ? `data-leave="${t.id}" title="Kliknij, aby zwolnić miejsce"` : `title="${escapeHtml(p.name)}"`}>
        <span class="tbl-pawn ${pop ? 'pop' : ''}" style="background:${avatarColor(p.name)}">${initials(p.name)}</span>
        <span class="tbl-name">${escapeHtml(p.name)}${mine ? ' (Ty)' : ''}</span>
      </div>`;
    } else {
      seatsHtml += `<div class="tbl-seat tbl-free" style="--a:${a}deg" ${live ? `data-join="${t.id}" title="Zajmij to miejsce"` : ''}><span class="tbl-plus">+</span></div>`;
    }
  }
  const badges = [];
  if (opts.badges) {
    if (tblIsPast(t)) badges.push('<span class="tbl-badge past">ODBYŁ SIĘ</span>');
    else {
      if (t.date === tblToday()) badges.push('<span class="tbl-badge">DZIŚ</span>');
      if (players.length >= seats) badges.push('<span class="tbl-badge full">KOMPLET</span>');
    }
    if (tblIsMine(t)) badges.push('<span class="tbl-badge mine">GRASZ</span>');
  }
  return `<div class="tbl-scene ${opts.big ? 'big' : ''}" style="--size:${typeof size === 'number' ? size + 'px' : size}">
    <div class="tbl-top"><span class="tbl-die"></span><span class="tbl-cards"><i></i><i></i></span></div>
    <div class="tbl-game">${box}</div>
    ${seatsHtml}
    ${badges.length ? `<div class="tbl-badges">${badges.join('')}</div>` : ''}
  </div>`;
}

function tblCardHtml(t) {
  const players = tblPlayers(t), seats = tblSeatsOf(t);
  const full = players.length >= seats, past = tblIsPast(t);
  const meIn = tblGetName() && t.players && t.players[tblKey(tblGetName())];
  const inLib = !!tblGameOf(t);
  let action = '';
  if (!past) {
    if (meIn) action = `<button class="btn btn-outline" data-leave="${t.id}">Wypisz się</button>`;
    else if (!full) action = `<button class="btn btn-green" data-join="${t.id}">Dołącz</button>`;
  }
  return `<div class="tbl-card ${past ? 'past' : ''}" data-open="${t.id}">
    ${tblSceneHtml(t, { size: 'clamp(240px, 20vw, 320px)', interactive: true, badges: true, animate: true })}
    <div class="tbl-info">
      <div class="tbl-title"><span>${escapeHtml(tblGameName(t))}${inLib ? '' : '<small>spoza biblioteczki</small>'}</span>${past ? '' : `<button class="tbl-share-ico" data-invite="${t.id}" title="Zaproś do stolika (link)">🔗</button>`}</div>
      <div class="tbl-meta">🕖 ${escapeHtml(t.time || '—')} · 📍 ${escapeHtml(t.place || '—')}<br>👑 ${escapeHtml(t.host || '—')}</div>
      <div class="tbl-foot">
        <span class="tbl-seats ${full ? 'full' : ''}">👥 ${players.length}/${seats}</span>
        <span class="tbl-progress ${full ? 'full' : ''}"><span style="width:${Math.round(players.length / seats * 100)}%"></span></span>
        ${action}
      </div>
    </div>
  </div>`;
}

// ---- główne okno ----
function openTables(view) {
  if (view) tblView = Object.assign({ mode: 'list', tab: 'upcoming', id: null, invited: null }, view);
  if (tblView.mode === 'form') tblView.mode = 'list';
  openModal(`<div class="modal modal-tables" id="tbl-root"></div>`);
  const root = document.getElementById('tbl-root');
  root.addEventListener('click', tblOnClick);
  tblRender();
}

function tblRender() {
  const root = document.getElementById('tbl-root');
  if (!root) return;
  const oldBody = document.getElementById('tbl-body');
  const scroll = oldBody ? oldBody.scrollTop : 0;
  if (tblView.mode === 'detail') {
    const t = tblList.find(x => x.id === tblView.id);
    if (!t) { tblView.mode = 'list'; return tblRender(); }
    root.innerHTML = `
      <div class="modal-head">
        <button class="arcade-back" data-act="back">‹ Wszystkie stoliki</button>
        <h2 class="display">🪑 Stolik</h2>
        <button onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="tbl-body">${tblDetailHtml(t)}</div>`;
  } else {
    const upcoming = tblList.filter(t => !tblIsPast(t));
    const mine = upcoming.filter(tblIsMine);
    const archive = tblList.filter(tblIsPast).reverse();
    const list = tblView.tab === 'mine' ? mine : tblView.tab === 'archive' ? archive : upcoming;
    const me = tblGetName();
    const tab = (k, label, n) => `<button class="tbl-tab ${tblView.tab === k ? 'active' : ''}" data-tab="${k}">${label}<span class="cnt">${n}</span></button>`;
    let floor;
    if (!list.length) {
      const demo = { id: '_demo', gameName: '?', seats: 4, players: {}, date: tblToday(), host: '' };
      floor = `<div class="tbl-empty">
        ${tblSceneHtml(demo, { size: 240 })}
        <p>${tblView.tab === 'archive' ? 'Archiwum jest puste.' : tblView.tab === 'mine' ? 'Nie siedzisz jeszcze przy żadnym stoliku.' : 'Sala czeka na graczy — załóż pierwszy stolik!'}</p>
        ${tblView.tab !== 'archive' ? '<button class="btn btn-gold" data-act="new">+ Nowy stolik</button>' : ''}
      </div>`;
    } else {
      const byDay = {};
      list.forEach(t => (byDay[t.date] = byDay[t.date] || []).push(t));
      floor = Object.keys(byDay).map(d => `
        <div class="tbl-day-block">
          <div class="tbl-day">📅 ${tblDayLabel(d)}</div>
          <div class="tbl-grid">${byDay[d].map(tblCardHtml).join('')}</div>
        </div>`).join('');
    }
    root.innerHTML = `
      <div class="modal-head"><h2 class="display">🪑 Stoliki do gry</h2><button onclick="closeModal()">✕</button></div>
      <div class="modal-body" id="tbl-body">
        <div class="tbl-toolbar">
          <div class="tbl-tabs">
            ${tab('upcoming', 'Nadchodzące', upcoming.length)}${tab('mine', 'Moje', mine.length)}${tab('archive', 'Archiwum', archive.length)}
          </div>
          <div class="tbl-toolbar-right">
            <span class="tbl-me">${me ? `Grasz jako <b>${escapeHtml(me)}</b> <button class="tbl-link" data-act="name">zmień</button>` : `<button class="tbl-link" data-act="name">Przedstaw się</button>`}</span>
            <button class="btn btn-outline tbl-set-btn" data-act="settings" title="Linki i powiadomienia na Slacku">⚙️ Linki i Slack${slackEnabled() ? ' <span class="tbl-slack-on">●</span>' : ''}</button>
            <button class="btn btn-gold" data-act="new">+ Nowy stolik</button>
          </div>
        </div>
        <div class="tbl-floor tbl-floor-main">${floor}</div>
      </div>`;
  }
  hydrateCovers(root);
  const body = document.getElementById('tbl-body');
  if (body) body.scrollTop = scroll;
}

function tblDetailHtml(t) {
  const players = tblPlayers(t), seats = tblSeatsOf(t), past = tblIsPast(t);
  const me = tblGetName(), meKey = me ? tblKey(me) : null;
  const meIn = meKey && t.players && t.players[meKey];
  const full = players.length >= seats;
  const g = tblGameOf(t);
  const end = (() => { const [hh, mm] = (t.time || '18:00').split(':').map(Number); const tot = hh * 60 + mm + tblDurationMin(g && g.duration); return `${tblPad(Math.floor(tot / 60) % 24)}:${tblPad(tot % 60)}`; })();
  let joinBtn = '';
  if (!past) {
    if (meIn) joinBtn = `<button class="btn btn-outline" data-leave="${t.id}">Zwolnij miejsce</button>`;
    else if (!full) joinBtn = `<button class="btn btn-green" data-join="${t.id}">🪑 Zajmij miejsce</button>`;
    else joinBtn = `<button class="btn btn-outline" disabled>Komplet graczy</button>`;
  }
  const invited = tblView.invited === t.id && !past;
  const banner = invited ? `<div class="tbl-invite-banner">
      <span style="font-size:30px">✉️</span>
      <div><b>Zaproszenie do stolika!</b><br>${escapeHtml(t.host || 'Ktoś')} zaprasza Cię do gry: <b style="font-size:inherit">${escapeHtml(tblGameName(t))}</b> — ${tblLongDate(t.date)}, ${escapeHtml(t.time)}.
      ${meIn ? 'Masz już tu miejsce 🎉' : full ? 'Niestety wszystkie miejsca są zajęte.' : `Wolne miejsca: ${seats - players.length}.`}</div>
      ${!meIn && !full ? `<button class="btn" data-join="${t.id}">🪑 Zajmij miejsce</button>` : ''}
    </div>` : '';
  return `${banner}<div class="tbl-detail">
    <div class="tbl-floor">${tblSceneHtml(t, { size: 'min(560px, 72vw, 64vh)', big: true, interactive: true, badges: true, animate: true })}</div>
    <div class="tbl-dl">
      <div class="tbl-dl-title">${escapeHtml(tblGameName(t))}</div>
      <div class="tbl-dl-row"><span>📅</span><span>${tblLongDate(t.date)}<br><small>${escapeHtml(t.time || '')} – ok. ${end}${g && g.duration ? ` (czas gry: ${escapeHtml(g.duration)})` : ''}</small></span></div>
      <div class="tbl-dl-row"><span>📍</span><span>${escapeHtml(t.place || '—')}</span></div>
      <div class="tbl-dl-row"><span>👑</span><span>Organizuje: <b>${escapeHtml(t.host || '—')}</b></span></div>
      <div class="tbl-dl-row"><span>👥</span><span>${players.length} z ${seats} miejsc zajętych${g && g.players ? ` <small>(gra na ${escapeHtml(g.players)} os.)</small>` : ''}</span></div>
      ${!g ? `<div class="tbl-dl-row"><span>📦</span><span><small>Gra spoza biblioteczki — ktoś musi ją przynieść.</small></span></div>` : ''}
      ${t.notes ? `<div class="tbl-notes">${escapeHtml(t.notes)}</div>` : ''}
      ${players.length ? `<div class="tbl-players">${players.map(p => `<span class="tbl-chip ${p.key === meKey ? 'me' : ''}">${avatarHtml(p.name)}${escapeHtml(p.name)}${tblKey(p.name) === tblKey(t.host) ? ' 👑' : ''}</span>`).join('')}</div>` : '<div class="rank-empty">Nikt jeszcze nie usiadł przy stole.</div>'}
      <div class="tbl-actions">
        ${joinBtn}
        ${!past ? `<button class="btn btn-gold" data-invite="${t.id}">🔗 Zaproś</button>` : ''}
        <button class="btn btn-outline" data-act="ics">📆 Do kalendarza</button>
        ${!past ? `<button class="btn btn-outline" data-act="edit">✎ Edytuj</button>` : ''}
        <button class="btn tbl-btn-danger" data-act="delete">🗑 Usuń</button>
      </div>
      ${g ? `<div><button class="tbl-link" data-act="game" style="font-family:'JetBrains Mono',monospace; font-size:11px">Pokaż grę w biblioteczce →</button></div>` : ''}
    </div>
  </div>`;
}

function tblOnClick(e) {
  const el = (sel) => e.target.closest(sel);
  let n;
  if ((n = el('[data-join]'))) { e.stopPropagation(); return tblJoin(n.dataset.join); }
  if ((n = el('[data-leave]'))) { e.stopPropagation(); return tblLeave(n.dataset.leave); }
  if ((n = el('[data-invite]'))) { e.stopPropagation(); return openTableInvite(n.dataset.invite); }
  if ((n = el('[data-tab]'))) { tblView.tab = n.dataset.tab; return tblRender(); }
  if ((n = el('[data-act]'))) {
    const act = n.dataset.act, t = tblList.find(x => x.id === tblView.id);
    if (act === 'back') { tblView.mode = 'list'; tblView.invited = null; return tblRender(); }
    if (act === 'new') return openTableForm(null);
    if (act === 'settings') return openAppSettings(() => openTables());
    if (act === 'name') return tblAskName(() => openTables(), true);
    if (act === 'edit' && t) return openTableForm(t.id);
    if (act === 'ics' && t) return tblDownloadIcs(t);
    if (act === 'game' && t) return openQuickActions(t.gameId);
    if (act === 'delete' && t) {
      return confirmAction(`Usunąć stolik „${tblGameName(t)}” (${fmtDate(t.date)}, ${t.time})?`, () => {
        tablesRef.child(t.id).remove().then(() => toast('Stolik usunięty.')).catch(tblWriteError);
        setTimeout(() => openTables({ mode: 'list', tab: tblView.tab }), 200);
      });
    }
    return;
  }
  if ((n = el('[data-open]'))) { tblView = Object.assign(tblView, { mode: 'detail', id: n.dataset.open }); return tblRender(); }
}

// ---- dołączanie i wypisywanie ----
function tblAskName(then, changing) {
  const cur = tblGetName();
  openModal(`
    <div class="modal">
      <div class="modal-head"><h2 class="display">${changing ? 'Twoje imię' : 'Kto siada przy stole?'}</h2><button onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field" id="tn-field"><label>Imię i nazwisko</label><input id="tn-name" maxlength="30" value="${escapeHtml(cur)}" placeholder="np. Anna Kowalska" autofocus><div class="field-error">Podaj imię</div></div>
        <div class="field-hint">Zapamiętamy je w tej przeglądarce, żeby następnym razem dołączać jednym kliknięciem.</div>
      </div>
      <div class="modal-foot" style="justify-content:flex-end"><button class="btn btn-green" id="tn-ok">${changing ? 'Zapisz' : 'Dołącz'}</button></div>
    </div>`);
  const input = document.getElementById('tn-name');
  setTimeout(() => input.focus(), 50);
  document.getElementById('tn-ok').onclick = () => {
    const v = input.value.trim();
    if (!v) { document.getElementById('tn-field').classList.add('invalid'); return; }
    tblSetName(v);
    then();
  };
}

function tblJoin(id) {
  const me = tblGetName();
  if (!me) return tblAskName(() => { openTables(); tblJoin(id); });
  const t = tblList.find(x => x.id === id);
  if (!t) return;
  if (tblIsPast(t)) return toast('Ten stolik już się odbył.', 'error');
  const k = tblKey(me);
  if (t.players && t.players[k]) return toast('Już siedzisz przy tym stoliku.');
  if (tblPlayers(t).length >= tblSeatsOf(t)) return toast('Przy tym stoliku nie ma już wolnych miejsc.', 'error');
  tablesRef.child(`${id}/players/${k}`).set({ name: me, joinedAt: Date.now() })
    .then(() => {
      toast(`Zajęto miejsce: ${tblGameName(t)} · ${t.time}`);
      const nt = JSON.parse(JSON.stringify(t));
      nt.players = Object.assign({}, nt.players, { [k]: { name: me, joinedAt: Date.now() } });
      slackNotify(tblPlayers(nt).length >= tblSeatsOf(nt) ? 'full' : 'join', nt, me);
    })
    .catch(tblWriteError);
}

function tblLeave(id) {
  const me = tblGetName();
  const t = tblList.find(x => x.id === id);
  if (!t || !me) return;
  tablesRef.child(`${id}/players/${tblKey(me)}`).remove()
    .then(() => { tblSeen.delete(id + ':' + tblKey(me)); toast('Zwolniono miejsce przy stoliku.'); })
    .catch(tblWriteError);
}

            </div>
            <div class="tbl-row2">
              <div class="field"><label>Miejsca przy stole</label>
                <div style="margin-top:4px"><div class="tbl-stepper"><button type="button" id="t-minus">−</button><span id="t-seats">${tblSeatsOf(draft)}</span><button type="button" id="t-plus">+</button></div></div>
              </div>
              <div class="field" id="t-host-field"><label>Organizator</label><input id="t-host" maxlength="30" value="${escapeHtml(draft.host || '')}" placeholder="Twoje imię"><div class="field-error">Podaj imię organizatora</div></div>
            </div>
            ${t ? '' : '<label class="tbl-check"><input type="checkbox" id="t-join" checked> Siadam przy stole jako pierwszy gracz</label>'}
            <div class="field"><label>Notatka (opcjonalnie)</label><textarea id="t-notes" rows="2" maxlength="300" placeholder="np. Tłumaczę zasady od zera, zabierzcie przekąski 🍕">${escapeHtml(draft.notes || '')}</textarea></div>
          </div>
          <div class="tbl-preview">
            <span class="tbl-preview-label">Podgląd stolika</span>
            <div class="tbl-floor" id="t-preview"></div>
          </div>
        </div>
      </div>
      <div class="modal-foot" style="justify-content:flex-end">
        <button class="btn btn-gold" id="t-save">${t ? 'Zapisz zmiany' : '🪑 Załóż stolik'}</button>
      </div>
    </div>`);

  const $ = (id) => document.getElementById(id);
  const minSeats = () => Math.max(2, tblPlayers(draft).length);
  function readDraft() {
    const sel = $('t-game').value;
    draft.gameId = sel && sel !== '__other' ? sel : '';
    draft.gameName = sel === '__other' ? $('t-other').value.trim() : '';
    draft.date = $('t-date').value; draft.time = $('t-time').value;
    draft.place = $('t-place').value.trim(); draft.host = $('t-host').value.trim();
    draft.notes = $('t-notes').value.trim();
  }
  function preview() {
    readDraft();
    const p = JSON.parse(JSON.stringify(draft));
    if (!t && $('t-join') && $('t-join').checked && p.host) p.players = { [tblKey(p.host)]: { name: p.host, joinedAt: 0 } };
    if (!p.gameId && !p.gameName) p.gameName = '?';
    $('t-preview').innerHTML = tblSceneHtml(p, { size: 220 });
    hydrateCovers($('t-preview'));
    const g = tblGameOf(draft);
    $('t-game-hint').textContent = g
      ? [g.players ? `Gra na ${g.players} os.` : '', g.duration ? `czas gry: ${g.duration}` : '', g.status === 'borrowed' ? `uwaga: wypożyczona przez ${g.borrower}` : ''].filter(Boolean).join(' · ')
      : '';
  }
  $('t-game').onchange = () => {
    const other = $('t-game').value === '__other';
    $('t-other-field').style.display = other ? '' : 'none';
    if (other) setTimeout(() => $('t-other').focus(), 30);
    const g = games.find(x => x.id === $('t-game').value);
    if (g && !seatsTouched && tblMaxPlayers(g.players)) {
      draft.seats = Math.max(minSeats(), arcClamp(tblMaxPlayers(g.players), 2, 10));
      $('t-seats').textContent = draft.seats;
    }
    preview();
  };
  ['t-other', 't-date', 't-time', 't-place', 't-host', 't-notes'].forEach(id => { $(id).oninput = preview; });
  if ($('t-join')) $('t-join').onchange = preview;
  $('t-minus').onclick = () => { seatsTouched = true; draft.seats = Math.max(minSeats(), tblSeatsOf(draft) - 1); $('t-seats').textContent = draft.seats; preview(); };
  $('t-plus').onclick = () => { seatsTouched = true; draft.seats = Math.min(10, tblSeatsOf(draft) + 1); $('t-seats').textContent = draft.seats; preview(); };
  $('t-back').onclick = () => openTables(t ? { mode: 'detail', id: t.id, tab: tblView.tab } : { mode: 'list', tab: tblView.tab });
  preview();

  $('t-save').onclick = () => {
    readDraft();
    const checks = [
      ['t-game-field', !!$('t-game').value],
      ['t-other-field', $('t-game').value !== '__other' || !!draft.gameName],
      ['t-date-field', !!draft.date && (t || draft.date >= tblToday())],
      ['t-time-field', !!draft.time],
      ['t-place-field', !!draft.place],
      ['t-host-field', !!draft.host]
    ];
    let ok = true;
    checks.forEach(([fid, valid]) => {
      const f = $(fid);
      f.classList.toggle('invalid', !valid);
      if (!valid) { ok = false; f.classList.add('shake'); setTimeout(() => f.classList.remove('shake'), 300); }
    });
    if (!ok) return;
    if (!tblGetName()) tblSetName(draft.host);
    const data = {
      id: draft.id, gameId: draft.gameId, gameName: draft.gameId ? '' : draft.gameName,
      date: draft.date, time: draft.time, place: draft.place, seats: tblSeatsOf(draft),
      host: draft.host, notes: draft.notes
    };
    let op;
    if (t) {
      op = tablesRef.child(t.id).update(data);
    } else {
      data.createdAt = Date.now();
      data.players = $('t-join').checked ? { [tblKey(draft.host)]: { name: draft.host, joinedAt: Date.now() } } : {};
      op = tablesRef.child(data.id).set(data);
    }
    op.then(() => {
      toast(t ? 'Zapisano zmiany stolika.' : `Stolik założony — czekamy na graczy!${slackEnabled() && appSettings.slack.onCreate ? ' Ogłoszenie poszło na Slacka.' : ''}`);
      if (!t) slackNotify('create', data);
      openTables({ mode: 'detail', id: data.id, tab: tblView.tab });
    }).catch(tblWriteError);
  };
}

// ---- eksport do kalendarza ----
function tblDownloadIcs(t) {
  const g = tblGameOf(t);
  const [hh, mm] = (t.time || '18:00').split(':').map(Number);
  const start = new Date(t.date + 'T00:00:00'); start.setHours(hh, mm, 0, 0);
  const end = new Date(start.getTime() + tblDurationMin(g && g.duration) * 60000);
  const f = (d) => `${d.getFullYear()}${tblPad(d.getMonth() + 1)}${tblPad(d.getDate())}T${tblPad(d.getHours())}${tblPad(d.getMinutes())}00`;
  const esc = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${tblPad(now.getUTCMonth() + 1)}${tblPad(now.getUTCDate())}T${tblPad(now.getUTCHours())}${tblPad(now.getUTCMinutes())}00Z`;
  const players = tblPlayers(t).map(p => p.name).join(', ');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Biblioteczka Gier JFF//Stoliki//PL', 'BEGIN:VEVENT',
    `UID:${t.id}@biblioteczka-gier`, `DTSTAMP:${stamp}`, `DTSTART:${f(start)}`, `DTEND:${f(end)}`,
    `SUMMARY:${esc('🎲 ' + tblGameName(t))}`, `LOCATION:${esc(t.place)}`,
    `DESCRIPTION:${esc(`Organizator: ${t.host}\nGracze: ${players || '—'}${t.notes ? '\n' + t.notes : ''}`)}`,
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `stolik-${t.date}-${tblKey(tblGameName(t))}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tblInviteUrl(id) { return publicLink('#t-' + id); }
function tblInviteText(t) {
  const players = tblPlayers(t), seats = tblSeatsOf(t), free = seats - players.length;
  return `🎲 Zaproszenie do gry: ${tblGameName(t)}\n` +
    `📅 ${tblLongDate(t.date)}, ${t.time}\n` +
    `📍 ${t.place}\n` +
    `👥 ${free > 0 ? `Wolne miejsca: ${free} z ${seats}` : 'Komplet — ale zajrzyj, może ktoś się zwolni'}` +
    `${players.length ? ` (grają: ${players.map(p => p.name).join(', ')})` : ''}\n` +
    `${t.notes ? `📝 ${t.notes}\n` : ''}` +
    (tblInviteUrl(t.id) ? `Zajmij miejsce przy stoliku: ${tblInviteUrl(t.id)}` : 'Zapisy: Biblioteczka Gier JFF → 🪑 Stoliki');

function tblCopy(text, btn, label) {
  const done = () => { if (btn) { const old = btn.innerHTML; btn.innerHTML = '✓ Skopiowano'; setTimeout(() => { btn.innerHTML = old; }, 1600); } toast(label || 'Skopiowano do schowka.'); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Nie udało się skopiować — zaznacz tekst i skopiuj ręcznie.', 'error'); }
    ta.remove();
  }
}

// Czy strona jest otwarta spod adresu, który inni też mogą otworzyć?
function isPublicPage() {
  return /^https?:$/.test(window.location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(window.location.hostname);
}
function publicBase() {
  if (isPublicPage()) return window.location.href.split('#')[0];
  const u = String(appSettings.publicUrl || '').trim();
  return /^https?:\/\/[^\s]+$/i.test(u) ? u.split('#')[0] : '';
}
function publicLink(hash) { const b = publicBase(); return b ? b + hash : ''; }
function pageLocationLabel() {
  if (window.location.protocol === 'file:') return 'plik na Twoim dysku';
  if (!isPublicPage()) return 'serwer lokalny na Twoim komputerze';
  return window.location.host;
}

// ---- Slack (Incoming Webhook) ----
function slackEnabled() { return /^https:\/\/hooks\.slack\.com\/services\/\S+$/.test(appSettings.slack.webhook || ''); }
function slackEsc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function slackTableText(t, headline) {
  const players = tblPlayers(t), seats = tblSeatsOf(t), free = seats - players.length;
  const url = tblInviteUrl(t.id);
  return `${headline}\n` +
    `*${slackEsc(tblGameName(t))}*\n` +
    `📅 ${tblLongDate(t.date)}, ${slackEsc(t.time)}\n` +
    `📍 ${slackEsc(t.place)}\n` +
    `👥 ${free > 0 ? `Wolne miejsca: ${free} z ${seats}` : `Komplet (${seats}/${seats})`}` +
    `${players.length ? ` · grają: ${slackEsc(players.map(p => p.name).join(', '))}` : ''}` +
    `${t.notes ? `\n📝 ${slackEsc(t.notes)}` : ''}` +
    `${url ? `\n<${url}|🪑 Zajmij miejsce przy stoliku>` : ''}`;
}
// Slack nie pozwala odczytać odpowiedzi z przeglądarki (CORS), więc wysyłamy „na ślepo” jako formularz.
function slackTableBlocks(t, headline) {
  const players = tblPlayers(t), url = tblInviteUrl(t.id);
  const blocks = [
    { type: 'section', text: { type: 'mrkdwn', text: headline } },
    { type: 'header', text: { type: 'plain_text', text: `🎲 ${tblGameName(t)}`.slice(0, 150), emoji: true } },
    { type: 'section', fields: [
      { type: 'mrkdwn', text: `*📅 Kiedy*\n${tblLongDate(t.date)}, ${slackEsc(t.time)}` },
      { type: 'mrkdwn', text: `*📍 Gdzie*\n${slackEsc(t.place)}` },
      { type: 'mrkdwn', text: `*👥 Miejsca*\n${tblFreeLabel(t)}` },
      { type: 'mrkdwn', text: `*👑 Organizuje*\n${slackEsc(t.host)}` }
    ] }
  ];
  if (t.notes) blocks.push({ type: 'section', text: { type: 'mrkdwn', text: `📝 ${slackEsc(t.notes)}` } });
  if (players.length) blocks.push({ type: 'context', elements: [{ type: 'mrkdwn', text: `Przy stole: ${players.map(p => slackEsc(p.name)).join(' · ')}` }] });
  const img = String(appSettings.slack.imageUrl || '').trim();
  if (/^https:\/\/\S+$/.test(img)) blocks.push({ type: 'image', image_url: img, alt_text: 'Biblioteczka Gier JFF' });
  if (url) blocks.push({ type: 'section', text: { type: 'mrkdwn', text: `<${url}|*🪑 Zajmij miejsce przy stoliku →*>` } });
  blocks.push({ type: 'divider' });
  return blocks;
}
function slackSend(text, webhookOverride, blocks) {
  const hook = webhookOverride || appSettings.slack.webhook;
  if (!/^https:\/\/hooks\.slack\.com\/services\/\S+$/.test(hook || '')) return Promise.resolve(false);
  const msg = { text, unfurl_links: false, unfurl_media: false };
  if (blocks && blocks.length) msg.blocks = blocks;
  const body = new URLSearchParams({ payload: JSON.stringify(msg) });
  return fetch(hook, { method: 'POST', mode: 'no-cors', body }).then(() => true, () => false);
}
function slackNotify(kind, t, extra) {
  if (!slackEnabled()) return;
  const s = appSettings.slack;
  let head = '';
  if (kind === 'create' && s.onCreate) head = `🪑 *${slackEsc(t.host)}* zakłada nowy stolik — kto się dosiada?`;
  if (kind === 'join' && s.onJoin) head = `🙋 *${slackEsc(extra)}* dosiada się do stolika`;
  if (kind === 'full' && s.onFull) head = `🎉 *Komplet przy stoliku!* Ostatnie miejsce zajmuje *${slackEsc(extra)}*`;
  if (head) slackSend(slackTableText(t, head), null, slackTableBlocks(t, head));
}

// ---- grafika zaproszenia do stolika (PNG 1200×630, do wklejenia razem z linkiem) ----
function tblPlural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (n === 1) return one;
  return (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? few : many;
}
function tblFreeLabel(t) {
  const seats = tblSeatsOf(t), free = seats - tblPlayers(t).length;
  if (free <= 0) return `Komplet (${seats}/${seats})`;
  return `${free} ${tblPlural(free, 'wolne miejsce', 'wolne miejsca', 'wolnych miejsc')} z ${seats}`;
}
function tblRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function tblWrap(ctx, text, maxW, maxLines) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width <= maxW || !cur) cur = test;
    else { lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    const kept = lines.slice(0, maxLines);
    let last = kept[maxLines - 1] + '…';
    while (ctx.measureText(last).width > maxW && last.length > 2) last = last.slice(0, -2) + '…';
    kept[maxLines - 1] = last;
    return kept;
  }
  return lines;
}
function tblLoadImg(src) {
  return new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}

async function tblRenderInviteImage(t) {
  const W = 1200, H = 630;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  try { await Promise.all(['700 64px Fraunces', '600 30px Inter', '700 24px "JetBrains Mono"'].map(f => document.fonts.load(f))); } catch (e) {}
  const SERIF = 'Fraunces, Georgia, serif', SANS = 'Inter, "Segoe UI", Arial, sans-serif', MONO = '"JetBrains Mono", Consolas, monospace';
  const g = tblGameOf(t);
  const gname = tblGameName(t);
  const cover = g && g.hasCover ? await getCover(g.id).then(src => src ? tblLoadImg(src) : null).catch(() => null) : null;

  // podłoga z desek
  const floor = ctx.createLinearGradient(0, 0, 0, H);
  floor.addColorStop(0, '#8A623E'); floor.addColorStop(1, '#6C482B');
  ctx.fillStyle = floor; ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 52) {
    ctx.fillStyle = (y / 52) % 2 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.035)'; ctx.fillRect(0, y, W, 52);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, y, W, 2);
    const off = (y / 52) % 2 ? 140 : 0;
    for (let x = off; x < W; x += 280) ctx.fillRect(x, y, 2, 52);
  }
  const vig = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 760);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

  // stół
  const cx = 300, cy = 315, R = 168;
  const seats = tblSeatsOf(t), players = tblPlayers(t), hostKey = tblKey(t.host);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  ctx.beginPath(); ctx.arc(cx, cy, R + 22, 0, Math.PI * 2); ctx.fillStyle = '#3F2614'; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, R + 18, 0, Math.PI * 2); ctx.fillStyle = '#6A4426'; ctx.fill();
  const felt = ctx.createRadialGradient(cx - 50, cy - 60, 20, cx, cy, R);
  felt.addColorStop(0, '#46996A'); felt.addColorStop(0.5, '#2F7752'); felt.addColorStop(1, '#225C3D');
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = felt; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.78, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 3; ctx.stroke();
  // kostka i karty
  ctx.save(); ctx.translate(cx + 96, cy + 86); ctx.rotate(0.3);
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
  tblRoundRect(ctx, -17, -17, 34, 34, 7); ctx.fillStyle = '#F4F1E8'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#26343F'; [[-8, -8], [0, 0], [8, 8]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(a, b, 3.6, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();
  [['#2e7f9b', -0.3], ['#F4F1E8', 0.15]].forEach(([col, rot]) => {
    ctx.save(); ctx.translate(cx - 116, cy + 50); ctx.rotate(rot);
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
    tblRoundRect(ctx, -20, -29, 40, 58, 5); ctx.fillStyle = col; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.strokeStyle = '#B8935F'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  });
  // pudełko gry
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.12);
  const B = 150;
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 22; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 12;
  ctx.fillStyle = '#F4F1E8'; tblRoundRect(ctx, -B / 2 - 5, -B / 2 - 5, B + 10, B + 10, 10); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.save(); tblRoundRect(ctx, -B / 2, -B / 2, B, B, 7); ctx.clip();
  if (cover) {
    const s = Math.max(B / cover.width, B / cover.height);
    ctx.drawImage(cover, -cover.width * s / 2, -cover.height * s / 2, cover.width * s, cover.height * s);
  } else {
    ctx.fillStyle = tblBoxColor(gname); ctx.fillRect(-B / 2, -B / 2, B, B);
    const shine = ctx.createLinearGradient(-B / 2, -B / 2, B / 2, B / 2);
    shine.addColorStop(0, 'rgba(255,255,255,0.25)'); shine.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = shine; ctx.fillRect(-B / 2, -B / 2, B, B);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `40px ${SANS}`; ctx.fillText('🎲', 0, -32);
    ctx.fillStyle = '#fff'; ctx.font = `700 22px ${SERIF}`;
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowOffsetY = 1; ctx.shadowBlur = 2;
    tblWrap(ctx, gname, B - 18, 3).forEach((ln, i, arr) => ctx.fillText(ln, 0, 18 + (i - (arr.length - 1) / 2) * 25));
  }
  ctx.restore(); ctx.restore();
  // krzesła i pionki
  for (let i = 0; i < seats; i++) {
    const a = -Math.PI / 2 + Math.PI * 2 * i / seats;
    const sx = cx + Math.cos(a) * (R + 30), sy = cy + Math.sin(a) * (R + 30);
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(a + Math.PI / 2);
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
    tblRoundRect(ctx, -34, -30, 68, 62, 16); ctx.fillStyle = '#6E4829'; ctx.fill();
    ctx.shadowColor = 'transparent';
    tblRoundRect(ctx, -34, -30, 68, 16, 10); ctx.fillStyle = '#4A2F1B'; ctx.fill();
    ctx.restore();
    const p = players[i];
    ctx.save(); ctx.translate(sx, sy);
    if (p) {
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
      ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI * 2); ctx.fillStyle = avatarColor(p.name); ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.lineWidth = 4; ctx.strokeStyle = '#F4F1E8'; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `700 19px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(initials(p.name), 0, 1);
      if (tblKey(p.name) === hostKey) { ctx.font = `24px ${SANS}`; ctx.fillText('👑', 20, -24); }
    } else {
      ctx.setLineDash([6, 5]); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,236,200,0.75)';
      ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,236,200,0.95)'; ctx.font = `700 28px ${SANS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+', 0, 1);
    }
    ctx.restore();
  }

  // karta z informacjami
  const px = 600, py = 70, pw = 540, ph = 490;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
  tblRoundRect(ctx, px, py, pw, ph, 22); ctx.fillStyle = '#F0EAD9'; ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#B8935F'; tblRoundRect(ctx, px, py, pw, 10, 5); ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let y = py + 62;
  ctx.fillStyle = '#9A7A4C'; ctx.font = `700 19px ${MONO}`;
  ctx.fillText('ZAPROSZENIE DO STOLIKA', px + 40, y);
  y += 22;
  let size = 52;
  ctx.font = `700 ${size}px ${SERIF}`;
  while (size > 34 && tblWrap(ctx, gname, pw - 80, 2).length > 1 && ctx.measureText(gname).width > (pw - 80) * 1.7) { size -= 4; ctx.font = `700 ${size}px ${SERIF}`; }
  ctx.fillStyle = '#16232B';
  tblWrap(ctx, gname, pw - 80, 2).forEach(ln => { y += size * 1.1; ctx.fillText(ln, px + 40, y); });
  y += 26;
  const dObj = new Date(t.date + 'T00:00:00');
  ctx.font = `500 26px ${SANS}`;
  const dateCandidates = [
    dObj.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + t.time,
    dObj.toLocaleDateString('pl-PL', { weekday: 'short', day: 'numeric', month: 'long' }) + ' · ' + t.time,
    dObj.toLocaleDateString('pl-PL', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + t.time
  ];
  const dateTxt = dateCandidates.find(s => ctx.measureText(s).width <= pw - 130) || dateCandidates[2];
  const rows = [
    ['📅', dateTxt],
    ['📍', t.place || '—'],
    ['👑', `Organizuje: ${t.host || '—'}`],
    ['👥', tblFreeLabel(t)]
  ];
  rows.forEach(([ico, txt], i) => {
    y += 44;
    ctx.font = `26px ${SANS}`; ctx.fillStyle = '#16232B'; ctx.fillText(ico, px + 40, y);
    ctx.font = `${i === 3 ? 600 : 500} 26px ${SANS}`;
    ctx.fillStyle = i === 3 ? (tblPlayers(t).length >= seats ? '#A8483A' : '#4F7A57') : '#16232B';
    ctx.fillText(tblWrap(ctx, txt, pw - 130, 1)[0], px + 86, y);
  });
  // stopka karty
  const fy = py + ph - 44;
  ctx.fillStyle = '#E6DFC8'; ctx.fillRect(px + 30, fy - 34, pw - 60, 2);
  ctx.font = `700 18px ${MONO}`; ctx.fillStyle = '#7A6A50';
  const url = tblInviteUrl(t.id);
  const foot = url ? url.replace(/^https?:\/\//, '') : 'Biblioteczka Gier JFF → 🪑 Stoliki';
  ctx.fillText(tblWrap(ctx, '🔗 ' + foot, pw - 80, 1)[0], px + 40, fy);
  // podpis strony
  ctx.font = `700 22px ${SERIF}`; ctx.fillStyle = 'rgba(244,235,221,0.92)'; ctx.textAlign = 'right';
  ctx.fillText('Biblioteczka Gier JFF', W - 60, H - 26);
  ctx.textAlign = 'left';
  return new Promise(res => c.toBlob(b => res({ blob: b, url: c.toDataURL('image/png') }), 'image/png'));
}

async function tblCopyInviteImage(t, btn) {
  const { blob } = await tblRenderInviteImage(t);
  try {
    if (!navigator.clipboard || !window.ClipboardItem) throw new Error('no clipboard');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    if (btn) { const old = btn.innerHTML; btn.innerHTML = '✓ Skopiowano'; setTimeout(() => { btn.innerHTML = old; }, 1600); }
    toast('Grafika skopiowana — wklej ją (Ctrl+V) w Slacku, mailu lub komunikatorze.');
  } catch (e) {
    tblDownloadInviteImage(t, blob);
    toast('Ta przeglądarka nie kopiuje obrazków — grafika została pobrana jako plik.');
  }
}
async function tblDownloadInviteImage(t, blob) {
  if (!blob) blob = (await tblRenderInviteImage(t)).blob;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `zaproszenie-${t.date}-${tblKey(tblGameName(t))}.png`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

let tblLinkHandled = false;
function tblHandleLink(fromHashChange) {
  const m = window.location.hash.match(/^#t-([A-Za-z0-9_-]+)$/);
  if (!m) return;
  if (tblLinkHandled && !fromHashChange) return;
  tblLinkHandled = true;
  const id = m[1];
  const t = tblList.find(x => x.id === id);
  history.replaceState(null, '', window.location.pathname + window.location.search);
  setTimeout(() => {
    if (!t) { toast('Ten stolik już nie istnieje — zobacz pozostałe.', 'error'); openTables({ mode: 'list', tab: 'upcoming' }); return; }
    openTables({ mode: 'detail', id, tab: tblIsPast(t) ? 'archive' : 'upcoming', invited: id });
  }, 350);
}

const NOTIF_KEY = 'biblioteczka-gier-notif-enabled';
const NOTIF_SEEN_KEY = 'biblioteczka-gier-notif-seen';
function notifSupported() { return 'Notification' in window; }
function notifEnabled() { return notifSupported() && Notification.permission === 'granted' && localStorage.getItem(NOTIF_KEY) === '1'; }
function updateNotifBtn() {
  const btn = document.getElementById('notifToggle');
  if (!notifSupported()) { btn.title = 'Ta przeglądarka nie obsługuje powiadomień'; btn.disabled = true; return; }
  btn.classList.toggle('active', notifEnabled());
  btn.title = notifEnabled()
    ? 'Powiadomienia włączone (działają, gdy ta karta jest otwarta)'
    : 'Włącz powiadomienia o zbliżających się terminach zwrotu';
}
function getNotifSeen() {
  try { return JSON.parse(localStorage.getItem(NOTIF_SEEN_KEY) || '{}'); } catch (e) { return {}; }
}
function markNotifSeen(key) {
  const seen = getNotifSeen();
  seen[key] = todayStr();
  localStorage.setItem(NOTIF_SEEN_KEY, JSON.stringify(seen));
}
function checkDueNotifications() {
  if (!notifEnabled()) return;
  const seen = getNotifSeen();
  games.forEach(g => {
    if (g.status === 'borrowed' && g.dueDate) {
      const d = daysUntil(g.dueDate);
      const key = 'due:' + g.id + ':' + g.dueDate;
      if (d !== null && d <= 1 && !seen[key]) {
        const body = d < 0 ? `Termin zwrotu minął ${Math.abs(d)} dni temu (${g.borrower})` : d === 0 ? `Termin zwrotu mija dziś (${g.borrower})` : `Termin zwrotu mija jutro (${g.borrower})`;
        new Notification('🎲 ' + g.name, { body, tag: key });
        markNotifSeen(key);
      }
    }
    (g.reservations || []).forEach(r => {
      const d = daysUntil(r.dateFrom);
      const key = 'res:' + g.id + ':' + r.id;
      if (d !== null && (d === 0 || d === 1) && !seen[key]) {
        new Notification('📅 ' + g.name, { body: d === 0 ? `Rezerwacja ${r.person} zaczyna się dziś` : `Rezerwacja ${r.person} zaczyna się jutro`, tag: key });
        markNotifSeen(key);
      }
    });
  });
  if (typeof tblList !== 'undefined') {
    const today = tblToday(), tomorrow = tblAddDays(today, 1);
    tblList.filter(t => (t.date === today || t.date === tomorrow) && tblGetName() && t.players && t.players[tblKey(tblGetName())]).forEach(t => {
      const key = 'tbl:' + t.id + ':' + t.date;
      if (seen[key]) return;
      new Notification('🪑 ' + tblGameName(t), { body: `${t.date === today ? 'Dziś' : 'Jutro'} o ${t.time} · ${t.place}`, tag: key });
      markNotifSeen(key);
    });
  }
}
document.getElementById('notifToggle').onclick = async () => {
  if (!notifSupported()) return;
  if (notifEnabled()) {
    localStorage.setItem(NOTIF_KEY, '0');
    updateNotifBtn();
    toast('Powiadomienia wyłączone.');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    localStorage.setItem(NOTIF_KEY, '1');
    updateNotifBtn();
    toast('Powiadomienia włączone — działają, gdy ta karta jest otwarta.');
    checkDueNotifications();
  } else {
    toast('Brak zgody na powiadomienia w przeglądarce.', 'error');
  }
};
updateNotifBtn();
setInterval(checkDueNotifications, 30 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkDueNotifications(); });

document.getElementById('shareBtn').onclick = () => {
  const base = publicBase();
  if (!base) {
    toast('Strona jest otwarta z pliku — inni nie otworzą tego adresu. Podaj publiczny adres strony.', 'error');
    openAppSettings();
    return;
  }
  tblCopy(base, null, 'Link do biblioteczki skopiowany.');
};

// Nasłuchiwanie zmian w czasie rzeczywistym - to jest sedno synchronizacji
// Śledzenie liczby osób aktualnie przeglądających stronę
const presenceListRef = db.ref('presence');
const myPresenceRef = presenceListRef.push();
db.ref('.info/connected').on('value', (snap) => {
  if (snap.val() === true) {
    myPresenceRef.onDisconnect().remove();
    myPresenceRef.set(true);
  }
});
presenceListRef.on('value', (snap) => {
  const count = snap.numChildren();
  const badge = document.getElementById('viewerBadge');
  const countEl = document.getElementById('viewerCount');
  if (count > 0) {
    const mod10 = count % 10, mod100 = count % 100;
    countEl.textContent = count === 1 ? '1 osoba online'
      : (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) ? count + ' osoby online'
      : count + ' osób online';
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }
});

gamesRef.on('value', (snapshot) => {
  const wasFirstLoad = firstLoad;
  const val = snapshot.val();
  if (val === null) {
    // Baza pusta - wgrywamy dane startowe tylko przy pierwszym uruchomieniu
    if (firstLoad) {
      const seedGames = [
        { id: uid(), name: "Nemesis: Odwet", status: "available", borrower: "", borrowedDate: "", dueDate: "", notes: "", bggUrl: "", hasCover: false, category: "", duration: "", players: "", tags: "", history: [], reservations: [] },
        { id: uid(), name: "Gloomhaven", status: "available", borrower: "", borrowedDate: "", dueDate: "", notes: "", bggUrl: "", hasCover: false, category: "", duration: "", players: "", tags: "", history: [], reservations: [] },
      ];
      const seedUpdates = {};
      seedGames.forEach(g => { seedUpdates['games/' + g.id] = g; });
      db.ref().update(seedUpdates);
      games = seedGames;
    }
  } else if (Array.isArray(val)) {
    // Stara struktura danych (tablica ze zdjęciami w środku) - jednorazowa migracja
    // na nową, oszczędniejszą strukturę (metadane osobno od zdjęć).
    const legacyGames = val.filter(Boolean);
    const keyedGames = {};
    const coverUpdates = {};
    legacyGames.forEach(g => {
      const { coverImage, ...meta } = g;
      meta.hasCover = !!coverImage;
      if (!meta.history) meta.history = [];
      if (!meta.reservations) meta.reservations = [];
      keyedGames[g.id] = meta;
      if (coverImage) {
        coverUpdates[g.id] = coverImage;
        coverCache.set(g.id, coverImage);
      }
    });
    gamesRef.set(keyedGames);
    if (Object.keys(coverUpdates).length) coversRef.update(coverUpdates);
    games = Object.values(keyedGames);
  } else {
    games = Object.values(val);
  }
  // Zabezpieczenie dla starszych wpisów zapisanych zanim dodano rezerwacje.
  games.forEach(g => { if (!g.reservations) g.reservations = []; if (!g.history) g.history = []; });
  firstLoad = false;
  document.getElementById('saveErrorBox').style.display = 'none';
  render();
  activateDueReservations();
  if (wasFirstLoad) {
    handleQrDeepLink();
    document.body.classList.remove('pre-intro');
    document.body.classList.add('intro-play');
  }
  checkDueNotifications();
}, (error) => {
  document.getElementById('saveErrorBox').style.display = 'block';
  document.getElementById('saveErrorBox').textContent = '⚠️ Błąd połączenia z bazą danych: ' + error.message;
  document.body.classList.remove('pre-intro');
});
// Zabezpieczenie: gdyby z jakiegoś powodu dane nigdy nie doszły, i tak pokaż stronę.
setTimeout(() => document.body.classList.remove('pre-intro'), 4000);

// Obsługa linku z kodu QR (#g-ID) - otwiera pełne okno szczegółów gry,
// działa niezależnie od trybu widoku (Lista / Półka)
function handleQrDeepLink() {
  const hash = window.location.hash.replace('#g-', '');
  if (!hash) return;
  const g = games.find(x => x.id === hash);
  if (!g) return;
  setTimeout(() => {
    openQuickActions(hash);
    const el = document.getElementById('card-' + hash);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.outline = '2px solid #B8935F';
      el.style.outlineOffset = '2px';
    }
  }, 250);
}

} // koniec bloku CONFIGURED
</script>
