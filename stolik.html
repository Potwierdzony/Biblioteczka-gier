<script>
  // Przekierowanie do biblioteczki z otwartym stolikiem (stolik.html?t=ID → ./#t-ID)
  (function () {
    var params = new URLSearchParams(window.location.search);
    var id = params.get('t') || (window.location.hash.indexOf('#t-') === 0 ? window.location.hash.slice(3) : '');
    var target = './' + (id ? '#t-' + encodeURIComponent(id) : '');
    window.__target = target;
    window.location.replace(target);
  })();
</script>
